  <title>다수가 승리하는 법</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  /* === 반응형 셀 크기 & 스크롤 가능 래퍼 === */
:root { --cell: 4rem; }                 /* 기본 PC 셀 크기 */
#board { 
  display: grid; 
  grid-template-columns: repeat(14, var(--cell));
  grid-template-rows:    repeat(14, var(--cell));
  gap: 0.25rem; 
}
#boardWrapper{
  overflow-x: auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  /* ✨ 포인터 제스처 충돌 방지: 드래그 스크롤 스크립트가 제어 */
  touch-action: pan-x pan-y;

  display: flex;
  justify-content: flex-start;
  align-items: flex-start;

  max-width: 100vw;
  max-height: calc(100vh - 200px);
  flex: 1 1 auto;
  min-height: 0;

  padding: 0.5rem;
}
#boardWrapper { position: relative; }
@media (max-width: 640px){
  :root { --cell: 2.5rem; }            /* 모바일 셀 크기 축소 */
}
/* 하단 고정 HUD가 상태 텍스트를 가리지 않도록 본문 하단 여백 확보 */
body { padding-bottom: 4.5rem; }
@media (max-width: 640px){
  body { padding-bottom: 3.5rem; }
}
/* ===== HUD: 모바일 컴팩트 + 접기 ===== */
#hudBar { transition: transform .25s ease; }

/* UI 숨김 토글 시: HUD만 하단으로 살짝 접어서 보드가 더 내려오도록 */
.ui-hidden #hudBar {
  transform: translateY(calc(100% - 40px));  /* 40px 만큼만 손잡이처럼 남김 */
}

/* 모바일에서 버튼/여백 축소 */
@media (max-width: 640px){
  #hudBar .mx-auto { padding-left: 0.5rem; padding-right: 0.5rem; }
  #hudBar .px-3.py-2 { padding: 0.375rem 0.5rem; } /* 버튼 컴팩트 */
  #hudBar button { font-size: 0.75rem; }           /* 글자도 살짝 줄임 */
  /* iOS 안전영역 */
  #hudBar { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
}
#popup{
  position: fixed;                 /* 화면 기준 배치 */
  z-index: 50;
  max-width: min(90vw, 28rem);
  word-break: keep-all;

  /* 가독성 강화 */
  background: rgba(255,255,255,0.98);  /* 밝은 배경 */
  color: #111;                         /* 기본 글자색: 진회색(검정에 가까움) */
  padding: 0.75rem 1rem;
  border-radius: 0.5rem;
  border: 1px solid rgba(0,0,0,0.1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

/* 팝업 내부 버튼/텍스트도 일괄 가독성 보장 */
#popup * { color: #111; } /* body의 text-white보다 우선(ID 선택자) */
#popup button{
  background: #fff;
  border: 1px solid #e5e7eb;      /* gray-200 */
  border-radius: 0.375rem;
}
#popup button:hover{
  background: #e5e7eb;            /* hover:bg-gray-200와 동일 톤 */
}
#board { margin: 0 auto; }
/* UI 숨김 모드 */
.ui-hidden #netBar,
.ui-hidden #teamBar {
  display: none !important;
}
/* 모바일에서 상단 바 자동 축소(접힌 높이) */
@media (max-width: 640px){
  #netBar, #teamBar {
    max-height: 28vh;
    overflow: auto;
  }
}
@media (max-width: 640px){
  #hudBar .mx-auto { padding-left: 0.5rem; padding-right: 0.5rem; }
  #hudBar .px-3.py-2 { padding: 0.375rem 0.5rem; } /* 버튼 컴팩트 */
  #hudBar button { font-size: 0.75rem; }           /* 글자도 살짝 줄임 */
  /* iOS 안전영역 */
  #hudBar { padding-bottom: max(env(safe-area-inset-bottom), 0px); }
  /* ★ 여기에 추가 ↓ */
  #toggleUiBtn, #skillMenuBtn {
    font-size: 0.75rem;
    padding: 0.25rem 0.5rem;
  }
  #turnDisplay {
    font-size: 1rem;
  }
}
/* 상단 고정 안내 배너: 패배/승리/상인 거래 결과 등 (기존엔 스타일이 없어 하단 HUD에 가려지거나 눈에 띄지 않았음) */
#defeatMsg {
  display: none;
  position: fixed;
  top: 5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 70;
  max-width: 90vw;
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  font-weight: 700;
  font-size: 1.05rem;
  text-align: center;
  padding: 0.75rem 1.25rem;
  border-radius: 0.5rem;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  pointer-events: none;
}
#skillPopup {
  position: fixed;
  z-index: 60;  /* popup보다 높게 */
  max-width: min(90vw, 40rem);
  max-height: 70vh;
  overflow-y: auto;
  background: rgba(139, 92, 246, 0.98);  /* 보라색 배경 */
  color: white;
  padding: 1rem;
  border-radius: 0.75rem;
  border: 2px solid rgba(167, 139, 250, 0.8);
  box-shadow: 0 20px 40px rgba(139, 92, 246, 0.6);
}
#evoPopup {
  position: fixed;
  z-index: 60;  /* skillPopup와 동일 레벨 */
  max-width: min(90vw, 40rem);
  max-height: 70vh;
  overflow-y: auto;
  background: rgba(139, 92, 246, 0.98);  /* 보라색 배경 */
  color: white;
  padding: 1rem;
  border-radius: 0.75rem;
  border: 2px solid rgba(167, 139, 250, 0.8);
  box-shadow: 0 20px 40px rgba(139, 92, 246, 0.6);
}

#evoPopup button {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: white;
  transition: all 0.2s;
}

#evoPopup button:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

#evoPopup button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
#skillPopup button {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: white;
  transition: all 0.2s;
}

#skillPopup button:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}

#skillPopup button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
#shopPopup {
  position: fixed;
  z-index: 60;  /* skillPopup와 동일 레벨 */
  max-width: min(90vw, 40rem);
  max-height: 70vh;
  overflow-y: auto;
  background: rgba(180, 83, 9, 0.98);  /* 상점 버튼과 어울리는 황토색 배경 */
  color: white;
  padding: 1rem;
  border-radius: 0.75rem;
  border: 2px solid rgba(217, 119, 6, 0.8);
  box-shadow: 0 20px 40px rgba(180, 83, 9, 0.6);
}
#shopPopup button {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: white;
  transition: all 0.2s;
}
#shopPopup button:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: translateY(-2px);
}
#shopPopup button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
/* 숨겨진 개발자 테스트 버튼: 평소엔 거의 안 보이다가 마우스를 올리면 살짝 드러남 */
#devTestBtn {
  position: fixed;
  left: 4px;
  bottom: 4px;
  width: 14px;
  height: 14px;
  padding: 0;
  border: none;
  border-radius: 3px;
  background: #222;
  opacity: 0.10;
  z-index: 100000;
  transition: opacity 0.2s;
}
#devTestBtn:hover { opacity: 0.6; cursor: pointer; }
#devPasswordPopup, #devPanel {
  position: fixed;
  z-index: 100000;
  max-width: min(92vw, 44rem);
  max-height: 82vh;
  overflow-y: auto;
  background: rgba(17, 17, 17, 0.98);
  color: white;
  padding: 1rem;
  border-radius: 0.75rem;
  border: 2px solid rgba(220, 38, 38, 0.7);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
}
#devPanel h3 {
  margin-top: 0.9rem;
  margin-bottom: 0.35rem;
  font-weight: bold;
  color: #f87171;
}
#devPanel .dev-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.4rem;
}
#devPanel input, #devPanel select {
  color: #111;
  border-radius: 0.3rem;
  padding: 0.2rem 0.4rem;
  border: 1px solid #999;
}
#devPanel input[type="number"] { width: 4.5rem; }
#devPanel button, #devPasswordPopup button {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: white;
  padding: 0.3rem 0.6rem;
  border-radius: 0.4rem;
  cursor: pointer;
}
#devPanel button:hover, #devPasswordPopup button:hover {
  background: rgba(255, 255, 255, 0.28);
}
#devPasswordPopup input {
  color: #111;
  border-radius: 0.3rem;
  padding: 0.3rem 0.5rem;
  border: 1px solid #999;
}
.snowball-icon { pointer-events: none; }

/* 왼쪽 빈 공간: 현재 차례의 사용 가능 액티브 스킬 / 발동 중인 패시브 표시 */
#turnSkillPanel {
  position: fixed;
  left: 0.75rem;
  top: 6rem;
  width: 15.5rem;
  max-height: calc(100vh - 10rem);
  overflow-y: auto;
  background: rgba(17, 24, 39, 0.92);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 0.5rem;
  padding: 0.75rem;
  font-size: 0.8rem;
  line-height: 1.35;
  z-index: 30;
}
#turnSkillPanel .tsp-title {
  font-weight: 700;
  margin-bottom: 0.25rem;
}
#turnSkillPanel .tsp-section {
  font-weight: 600;
  margin-top: 0.6rem;
  margin-bottom: 0.25rem;
}
#turnSkillPanel .tsp-empty { color: #9ca3af; }
/* 보드 옆 여유 공간이 없는 화면에서는 보드를 가리지 않도록 숨김 */
@media (max-width: 1180px){
  #turnSkillPanel { display: none; }
}

  <h1 class="text-3xl font-bold mb-4">다수가 승리하는 법</h1>
  <!-- ★ 추가: 버튼과 턴 표시를 한 줄로 -->
  <div class="flex items-center justify-center gap-2 mb-4">
    <button id="toggleUiBtn" class="px-2 py-1 rounded bg-gray-800 border border-gray-600 text-sm">
      UI 숨기기
    </button>
    <div id="turnDisplay" class="text-xl font-bold">턴: 1</div>
    <button id="skillMenuBtn" class="px-2 py-1 rounded bg-purple-600 text-white text-sm">
      스킬창
    </button>
    <button id="shopMenuBtn" class="px-2 py-1 rounded bg-yellow-600 text-white text-sm" style="display:none">
      상점
    </button>
    <button id="evoMenuBtn" class="px-2 py-1 rounded bg-amber-500 text-black text-sm">
  진화창
</button>
  </div>
  <div id="scoreBoard" class="mb-4 flex items-center justify-center gap-4 text-sm font-bold"></div>
  <!-- 모드 선택 바 -->
<div id="netBar" class="w-full max-w-5xl mx-auto mb-2 grid grid-cols-1 lg:grid-cols-3 gap-2">
  <div class="col-span-2 rounded-lg border border-gray-700 p-3">
    <div class="flex items-center justify-between">
      <div class="font-semibold">온라인/오프라인</div>
      <div id="mpStatus" class="text-sm text-gray-300">오프라인</div>
    </div>
    <div class="mt-2 grid grid-cols-2 md:grid-cols-6 gap-2">
      <input id="nameInput" class="col-span-2 px-2 py-1 rounded bg-gray-800 border border-gray-600" placeholder="닉네임">
      <input id="roomInput" class="col-span-2 px-2 py-1 rounded bg-gray-800 border border-gray-600 font-mono" placeholder="원하는 방 코드 입력(비우면 자동 생성)">
      <button id="createRoomBtn" class="px-2 py-1 rounded bg-indigo-500 text-white">방 만들기</button>
      <button id="joinRoomBtn" class="px-2 py-1 rounded border border-gray-600">입장</button>
      <button id="startOnlineBtn" class="px-2 py-1 rounded bg-emerald-500 text-black" disabled title="호스트만 시작할 수 있습니다">온라인 시작(호스트)</button>
      <button id="leaveRoomBtn" class="px-2 py-1 rounded border border-gray-600">나가기</button>

const mpStatus = document.getElementById('mpStatus');

function randRoom(){

}
// 게스트가 호스트를 처음 찾는 단계에서만 쓰는 재시도 상태.
// (호스트가 "방 만들기"를 누른 직후엔 자기 Peer가 시그널링 서버에 등록되기까지

//  아직 준비 중인 것뿐이므로, 몇 차례 자동 재시도해서 이 경합을 흡수한다.)
let __joinRetryCount = 0;
const JOIN_MAX_RETRIES = 5;
const JOIN_RETRY_DELAY_MS = 1500;
// 시그널링(방 찾기) 자체는 성공했는데 실제 WebRTC 데이터 채널이 끝내 열리지 않고
// 아무 오류 이벤트도 없이 "연결 중..."에서 멈춰버리는 경우(네트워크/TURN 문제 등)를
// 대비한 타임아웃. 이 시간 안에 안 열리면 실패로 간주하고 같은 재시도 루틴을 탄다.
const JOIN_CONNECT_TIMEOUT_MS = 8000;
// P2P (PeerJS)
let online = false;
let peer = null;          // 내 Peer
let myPeerId = null;
// ▼ 호스트(방 생성자) 고정용
let __hostId = null;      // 방의 호스트 PeerID
let __iAmCreator = false; // 내가 방을 '생성'했는지 여부
let roomCode = null;      // 방 코드(호스트/게스트 공통 사용)
const conns = new Map();  // peerId -> DataConnection

// 드래프트 준비 신호(온라인 동시 드래프트용)
const draftSignals = {
  peersReady: new Set(),  // 준비 완료 신호를 보낸 peerId 집합
  finalized: false        // 중복 확정 방지
};
function draftWaitingMessage() {
  const total = connectedPeerCount();
  const done = draftSignals.peersReady.size;
  return `다른 플레이어의 선택을 기다리고 있습니다… (${done} / ${total})`;
}
function updateDraftWaitingStatus() {
  if (!specialDraft?.active) return;
  if (draftSignals.peersReady.has(myPeerId)) {
    status && (status.textContent = draftWaitingMessage());
  }
}

let owners = {}; // 예: { "0": "peerA", "1": "peerB", ... }
// 상태 동기화 충돌 방지용 버전(신규)
let __stateVersion = 0;

function ownsAnotherTeam(peerId, exceptTeam = null){
  if (!owners) return false;
  for (const [k, v] of Object.entries(owners)) {
    if (v === peerId && String(k) !== String(exceptTeam)) return true;
  }
  return false;
}
function enforceSingleTeamOwnership(){
  if (!owners) return;
  const seen = new Set();
  for (const k of Object.keys(owners)) {
    const pid = owners[k];
    if (!pid) continue;
    if (seen.has(pid)) {
      owners[k] = null;       // 같은 피어가 이미 다른 팀을 점유 중이면 해제
    } else {
      seen.add(pid);
    }
  }
}

function anchorId() {
  return [...conns.keys()].concat(myPeerId).sort()[0];
}
function isAnchor() {
  try { return myPeerId && (myPeerId === anchorId()); }
  catch(e){ return false; }
}
function updateStartBtnLock() {
  if (!startOnlineBtn) return;
  const ok = !!(myPeerId && __hostId && myPeerId === __hostId);
  startOnlineBtn.disabled = !ok;
  startOnlineBtn.title = ok ? '' : '호스트만 시작할 수 있습니다';
}
// 엔진 검증용 해시(아주 단순 MD5 대용으로 JSON 문자열 해시)
function hashState() {
  const s = JSON.stringify({
    players, currentTurn, currentRound, snowballs
  });
  let h = 0; for (let i=0;i<s.length;i++) { h = (h*31 + s.charCodeAt(i))|0; }
  return (h >>> 0).toString(16);
}
// 방을 새로 만들거나 입장하기 전, 이전에 남아있던 Peer/연결을 정리한다.
// (정리하지 않으면 이전 Peer 객체의 이벤트 핸들러가 살아남아 myPeerId/__hostId 등
//  전역 상태를 뒤늦게 덮어써서 "게임 시작"이 먹통이 되는 것처럼 보이는 원인이 됨)
function resetPeerConnection() {
  try { peer?.removeAllListeners?.(); } catch(e){}
  try { peer?.destroy(); } catch(e){}
  peer = null;
  conns.clear();
  __hostId = null;
  myPeerId = null;
  updateStartBtnLock();
}
async function p2pCreateRoom() {
  resetPeerConnection();
  roomCode = (roomInput.value.trim().toUpperCase()) || randRoom();
  __iAmCreator = true;

  // 호스트는 고정된 패턴의 ID 사용 (다른 참가자들이 찾을 수 있도록)
  peer = new Peer(`${roomCode}-host`);

  online = true;

  roomInput.value = roomCode;

async function p2pJoinRoom() {

  if (!code) {

    return;
  }
  roomCode = code;
  __iAmCreator = false;
  __joinRetryCount = 0;
  online = true;
  createGuestPeer();
  mpStatus.textContent = `${roomCode} · 입장 시도 중...`;

  updateStartBtnLock();

// 게스트 → 호스트 접속 시도(최초 시도 및 재시도에서 공용으로 사용)
function attemptConnectToHost() {
  const hostId = `${roomCode}-host`;
  const conn = peer.connect(hostId, { reliable: true });
  setupConn(conn);
  mpStatus.textContent = `${roomCode} · 호스트에 연결 중...`;

  // 시그널링은 통과했지만 데이터 채널이 끝내 안 열리는 경우(오류 이벤트 없이 멈춤)를 대비
  const attemptRoomCode = roomCode;
  setTimeout(() => {
    if (!__iAmCreator && roomCode === attemptRoomCode && !conn.open) {
      handleJoinAttemptFailed();
    }
  }, JOIN_CONNECT_TIMEOUT_MS);
}
// 방 찾기 실패(peer-unavailable) 또는 연결 타임아웃을 동일하게 처리:
// 남은 횟수가 있으면 새 Peer로 재시도, 아니면 최종 실패 메시지 표시.
function handleJoinAttemptFailed() {
  if (conns.get(`${roomCode}-host`)?.open) return; // 그 사이 연결되었으면 무시
  if (__joinRetryCount < JOIN_MAX_RETRIES) {
    __joinRetryCount++;
    const retryingRoomCode = roomCode;
    mpStatus.textContent = `${roomCode} · 방을 찾는 중... 재시도 (${__joinRetryCount}/${JOIN_MAX_RETRIES})`;
    setTimeout(() => {
      if (online && !__iAmCreator && roomCode === retryingRoomCode && !conns.get(`${roomCode}-host`)?.open) {
        createGuestPeer();
      }
    }, JOIN_RETRY_DELAY_MS);
  } else {
    mpStatus.textContent = `${roomCode} · 연결 실패: 방을 찾을 수 없습니다. 방 코드와 호스트 접속 상태를 확인해 주세요`;
  }
}
// 게스트용 Peer를 (재)생성한다. 재시도할 때도 이 함수를 다시 호출해서
// 완전히 새로운 Peer/연결 객체로 시작한다 — 실패했던 기존 Peer에 대고
// connect()를 다시 호출하면 PeerJS 내부적으로 이전 시도의 상태가 남아
// 새 시도가 응답 없이 멈춰버리는 경우가 있어, 재시도는 항상 새 Peer로 한다.
function createGuestPeer() {
  resetPeerConnection();
  peer = new Peer(`${roomCode}-guest-${Math.random().toString(36).slice(2,6)}`);
  wirePeerEvents();
}
function wirePeerEvents() {
  peer.on('open', (id) => {
    myPeerId = id;
    if (myPeerIdLabel) myPeerIdLabel.textContent = id;

    myNick = getMyNick();
    localStorage.setItem('multi_nick', myNick);
    nickMap.set(myPeerId, myNick);

    mpStatus.textContent = roomCode ? `${roomCode} · ${myNick}` : `${myNick}`;
    
    // 내가 방을 만들었다면 호스트로 확정
    if (__iAmCreator) {
      __hostId = myPeerId;
      broadcast({ t:'HOST', hostId: __hostId });
      mpStatus.textContent = `${roomCode} · 방 생성 완료 (호스트)`;
    } else {
      // 게스트라면 호스트에게 연결 시도
      attemptConnectToHost();
    }
    
    // 내 닉네임과 현재 연결된 피어 목록 전송
    broadcast({ t: 'HELLO', from: myPeerId, nick: myNick, peers: Array.from(conns.keys()) });
    updateDraftWaitingStatus();

    updateStartBtnLock();
  });  
  peer.on('connection', (conn) => {
    setupConn(conn);
    updateStartBtnLock();
updateDraftWaitingStatus();

  });
peer.on('disconnected', () => {
  console.log('Peer disconnected');
  if (!peer.destroyed) {
    try {
      peer.reconnect();
    } catch(e) {
      console.warn('Reconnect failed:', e);
    }
  }
  pruneOwnersForConnectedPeers();
  updateDraftWaitingStatus();

});

peer.on('error', (e) => {
  console.warn('Peer error:', e);
  if (e.type === 'peer-unavailable') {
    // 게스트가 호스트를 아직 못 찾은 경우: 호스트 쪽 Peer가 시그널링 서버에
    // 등록되는 중일 수 있으므로 잠시 후 자동 재시도한다 (아직 실제로 연결된 적이 없을 때만).
    if (!__iAmCreator) {
      handleJoinAttemptFailed();
    }
  } else if (e.type === 'network') {
    mpStatus.textContent = `${roomCode} · 네트워크 오류`;
  } else if (e.type === 'unavailable-id') {
    mpStatus.textContent = `${roomCode} · 이미 사용 중인 방 코드입니다. 다른 코드로 다시 만들어 주세요`;
  } else {
    mpStatus.textContent = `${roomCode} · 오류: ${e.type}`;
  }
  updateStartBtnLock();
});
}
function connectTo(hostPeerId) {
  const conn = peer.connect(hostPeerId, { reliable: true });
  setupConn(conn);
}
function setupConn(conn) {
  conns.set(conn.peer, conn);
  
  conn.on('open', () => {
    conn.send({ t: 'HELLO', from: myPeerId, nick: getMyNick(), peers: Array.from(conns.keys()) });
    conn.send({ t: 'ASK_SYNC', from: myPeerId });
    
    if (__hostId) conn.send({ t:'HOST', hostId: __hostId });
    
    mpStatus.textContent = `${roomCode} · 연결됨 (총 ${conns.size + 1}명)`;

function advanceDeployTeam() {
  // ✅ 온라인(동시 배치): 모두 끝났는지만 확인
  if (online) {
    if (allDeploymentDone()) {
      deploy.active = false;
      status && (status.textContent = '배치 완료! 게임을 진행하세요');
      drawBoard();
      if (online) {
        const state = toRoomState();
        broadcast({ t:'SYNC', state, hash: hashState() });
      }
    }
    return;
  }

  // ⬇️ 오프라인(기존 순차) 로직 그대로
  deploy.idx++;
  while (deploy.idx < deploy.order.length) {
    const t = deploy.order[deploy.idx];
    const q = deploy.queueByTeam.get(t) || [];
    if (!isTeamActive(t) || q.length === 0) { deploy.idx++; continue; }
    break;
  }
  if (deploy.idx >= deploy.order.length) {
    deploy.active = false;
    status && (status.textContent = '배치 완료! 게임을 진행하세요');
    drawBoard();
    return;
  }
  status && (status.textContent = `배치 단계: 플레이어 ${currentDeployTeam()+1}가 배치합니다`);
}

const __history = [];
function deepClone(v){ return JSON.parse(JSON.stringify(v)); }
function pushSnapshot(reason=''){
  __history.push({
  reason,
  players: deepClone(players),

  gifts: deepClone(gifts),
  shadowMarkers: deepClone(shadowMarkers),
  currentTurn, currentRound, moveEnergy, diceRolledThisTurn, lastDiceRoll, selectedPlayerId,
  ninjaSwap: deepClone(ninjaSwap), cartLink: deepClone(cartLink)
});
  if (__history.length > 30) __history.shift();
  
}
function restoreLastSnapshot(){
  const snap = __history.pop();
  if (!snap) { status && (status.textContent='되돌릴 스냅샷이 없습니다'); return; }
  players.splice(0, players.length, ...snap.players);
  snowballs.splice(0, snowballs.length, ...snap.snowballs);
  gifts.splice(0, gifts.length, ...(snap.gifts || []));
  shadowMarkers = snap.shadowMarkers || [];
  currentTurn = snap.currentTurn; 
currentRound = snap.currentRound;
moveEnergy = snap.moveEnergy; 
diceRolledThisTurn = snap.diceRolledThisTurn;
lastDiceRoll = snap.lastDiceRoll ?? null;

      const stepY = dy > 0 ? 1 : -1;

function applyEvolution(u){
  switch(u.name){
    case '광대':
      return true;

    case '고목':
      if (typeof u._idleTurns !== 'number') u._idleTurns = 0;
      u.power = u.range = Math.min(6, (u._idleTurns ?? 0) + 2);
      return true;

    case '닌자':
      return true;

    case '도박사':
      // 진화 → 도박꾼 (스탯 동일)
      u.name = '도박꾼';
      u._evolved = true;
      return true;

    default:
      status && (status.textContent = `${displayName(u)}는 아직 진화 효과가 등록되지 않았습니다`);
      return false;
  }
}
function canEvolve(u){
  if (!u || !isSpecialUnit(u) || u._evolved) return false;
  // 실제로 구현된 진화만 허용
  const implemented = new Set(['광대','고목','닌자','도박사']);

function randomEmptyCell() {

  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {

function randomEmptyCellInSnowmanRange(snowman) {
  if (!snowman) return randomEmptyCell();
  const r = Number(snowman.range ?? 1);
  const spots = [];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    if (cellOccupied(x,y) || snowballAt(x,y) !== -1) continue;
    if (Math.abs(x - snowman.x) + Math.abs(y - snowman.y) <= r) spots.push({x,y});
  }
  if (spots.length === 0) return randomEmptyCell();
  return spots[Math.floor(Math.random() * spots.length)];
}
function syncSnowballsToSnowmen() {

  while (snowballs.length < count) {
    const anchor = snowmen[Math.floor(Math.random() * snowmen.length)];
    const pos = randomEmptyCellInSnowmanRange(anchor);
    if (!pos) break;
    snowballs.push(pos);
  }
  while (snowballs.length > count) snowballs.pop();
}

function getClownSuppressionTeams(unitsOnCell){
  const teamsHere = new Set(unitsOnCell.map(u => u.team));
  const suppressed = new Set();

  // ① 기본: 전투 칸에 광대가 있으면 상대 지원 0
  for (const u of unitsOnCell) {
    if (u.name === '광대' && !u._evolved) {
      for (const t of teamsHere) if (t !== u.team) suppressed.add(t);
    }
  }

  // ② 진화 광대: 그 팀이 전투에 ‘참여’하기만 하면 상대 지원 0
  //    (진화 광대 본인은 어디에 있어도 상관없음)
  const teamsWithEvolvedClown = new Set(
    players.filter(p => p.name === '광대' && p._evolved).map(p => p.team)
  );
  for (const t of teamsHere) {
    if (teamsWithEvolvedClown.has(t)) {
      for (const opp of teamsHere) if (opp !== t) suppressed.add(opp);
    }
  }
  return suppressed;
}

// 왕좌 쟁탈전: 왕의 시작 위치 — 코너에 뭉쳐있는 병력 더미와 떨어진 별도의 "옥좌" 자리
// (병력 전체를 뚫어야만 왕을 노릴 수 있는 상황을 줄이기 위함. 왕 스스로 이동해 병력과 합류하는 것은 자유)
function getKingThroneCell(team) {
  const corner = getTeamCorner(team);
  const dx = corner.x === 0 ? 3 : -3;
  const dy = corner.y === 0 ? 3 : -3;
  return {
    x: Math.max(0, Math.min(size - 1, corner.x + dx)),
    y: Math.max(0, Math.min(size - 1, corner.y + dy))
  };
}
// 왕좌 쟁탈전: 각 팀(아직 살아있는=일반 병사가 남아있는 팀)에 왕을 1기씩 배치
function ensureKingsForAllTeams() {
  for (let t = 0; t < 4; t++) {
    const hasKing = players.some(p => p.team === t && p.name === '왕');
    if (hasKing) continue;
    const seed = players.find(p => p.team === t && p.name === '일반 병사');
    if (!seed) continue; // 이미 제외된 팀
    const throne = getKingThroneCell(t);
    players.push({
      // 전투력 2: 잡병 1기가 우연히 들어와도 이기지 못하도록(최소 2기 이상의 진짜 습격조가 필요)
      id: `p${t + 1}-king`, name: '왕', x: throne.x, y: throne.y,
      color: seed.color, power: 2, team: t, movement: 1, range: 0
    });
  }
}

// 점령전: 왕좌 쟁탈전에서 넘어온 잔여 왕 유닛 정리
function removeAllKings() {
  for (let i = players.length - 1; i >= 0; i--) {

// 팀별 보유 '일반 병사' 수(보드 위에 살아있는 것만)
function getTycoonSoldierCount(team) {
  return players.filter(p => p.team === team && p.name === '일반 병사').length;
}
// 신규 유닛에 그 팀이 상점에서 누적한 전투력/이동 보너스를 적용
function applyTycoonUnitBonuses(u) {
  if (gameMode !== 'tycoon' || !u) return u;
  const t = u.team;
  u._tyBaseMove = u.movement;
  u.power = +(( (u.power ?? 0) + (tycoonPowerBonus[t] || 0) )).toFixed(3);
  u.movement = Math.round(u._tyBaseMove * (tycoonMoveMult[t] ?? 1) * 100) / 100;
  return u;
}
// 이동력 강화 구매 시: 그 팀 보유 유닛 전체의 movement를 새 배율로 재계산
function reapplyTycoonMoveBonusForTeam(team) {
  for (const u of players) {
    if (u.team !== team) continue;
    if (u._tyBaseMove === undefined) u._tyBaseMove = u.movement;
    u.movement = Math.round(u._tyBaseMove * (tycoonMoveMult[team] ?? 1) * 100) / 100;
  }
}
// 보스 등장 칸: 13x13 보드의 정중앙(0-based 6,6 = 7번째 칸)
function getTycoonBossCell() {

function spawnTycoonBoss() {
  // 남아있는 보스가 있으면(전투 미해결 등) 새로 만들지 않음
  if (players.some(p => p.team === TYCOON_BOSS_TEAM)) return;
  const stage = Math.max(1, Math.round(currentRound / TYCOON_CONFIG.bossIntervalRounds));
  const power = TYCOON_CONFIG.bossBasePower + TYCOON_CONFIG.bossPowerPerStage * (stage - 1);
  const reward = TYCOON_CONFIG.bossBaseReward + TYCOON_CONFIG.bossRewardPerStage * (stage - 1);
  const cell = getTycoonBossCell();
  players.push({
    id: `boss-${currentRound}-${Date.now()}`,
    name: '보스', team: TYCOON_BOSS_TEAM, x: cell.x, y: cell.y,
    color: 'bg-black', power, range: 0, movement: 0, type: 'boss', bossReward: reward
  });

  showCenterMessage?.(`👹 보스 출현! (전투력 ${power}, 처치 시 골드 +${reward})`, 2500);

// 턴 종료 정산: 불로소득 지급 → (라운드 갱신 이후) 보스 스폰 체크는 endTurn에서 처리 → 승리 판정
function settleTycoonTurn() {
  if (gameEnded) return;
  const soldiers = getTycoonSoldierCount(currentTurn);
  if (soldiers > 0) {
    teamGold[currentTurn] = (teamGold[currentTurn] || 0) + soldiers * TYCOON_CONFIG.incomePerSoldierPerTurn;
  }
  updateScoreBoard();
  checkTycoonWin();
}
function checkTycoonWin() {
  if (gameEnded) return;
  const winTeam = teamGold.findIndex(g => g >= TYCOON_CONFIG.goldGoal);
  if (winTeam === -1) return;
  gameEnded = true;
  const msg = `🏆 플레이어 ${winTeam + 1} 승리! (골드 ${teamGold[winTeam]} 달성 - 타이쿤 모드)`;

function manhattanDist(ax, ay, bx, by){ return Math.abs(ax-bx)+Math.abs(ay-by); }
function collectUnitsInRadius(cx, cy, r, predicate){
  const out=[]; for(const u of players){ if (!predicate||predicate(u)) {
    if (u.x>=0 && u.y>=0 && manhattanDist(u.x,u.y,cx,cy)<=r) out.push(u);
  }} return out;
}
function nearestEmptyCell(fromX, fromY){
  // 반경 1 → 2 → 3 순서로만 탐색(너무 멀리 퍼지지 않게)
  for (let r = 1; r <= 3; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) + Math.abs(dy) > r) continue;
        const x = fromX + dx, y = fromY + dy;
        if (x < 0 || y < 0 || x >= size || y >= size) continue;
        if (!cellOccupied(x,y) && snowballAt(x,y) === -1) {
          return { x, y };
        }
      }
    }
  }
  return null;
}
function banishUnits(units, durationRounds, exceptId){
  const until = currentRound + durationRounds;
  for (const u of units){
    if (u.id===exceptId) continue;
    if (u.name==='왕' || isCastle?.(u)) continue;
    if (u._banishedUntilRound && u._banishedUntilRound>=until) continue;
    u._banishedUntilRound = until;
    u._banishedReturn = { x: u.x, y: u.y };
    u.x = -1; u.y = -1; // 보드에서 제거
  }
}
function processBanishedReturns(turnTeam){
  for (const u of players){
    if (u.team!==turnTeam) continue;
    if (!u._banishedUntilRound) continue;
    if (currentRound < u._banishedUntilRound) continue;
    const backTo = u._banishedReturn || getTeamStartPos(u.team);
let dest = backTo;

// 1) 원래 칸
if (!cellOccupied(backTo.x, backTo.y) && snowballAt(backTo.x, backTo.y) === -1) {
  dest = backTo;
} else {
  // 2) 같은 팀 출발지점 시도
  const kp = getTeamStartPos(u.team);
  if (kp && !cellOccupied(kp.x, kp.y) && snowballAt(kp.x, kp.y) === -1) {
    dest = kp;
  } else {
    // 3) 근거리(반경1~3)만 검색
    const near = nearestEmptyCell(backTo.x, backTo.y);
    dest = near || backTo;
  }
}

u.x = dest.x; u.y = dest.y;
    delete u._banishedUntilRound;
    delete u._banishedReturn;
  }
}

      u.power = +( (u.power ?? 0) - u._cheerBuffVal ).toFixed(3);
      delete u._cheerBuffTeam;
      delete u._cheerBuffVal;

// ✅ 해당 팀 턴 시작 시 새 버프 적용 (사거리 5, 대상: 아군 '일반 병사', 중복 가능)
function applyCheerBuffsForTeam(team){
  const cheers = players.filter(p => p.team === team && p.name === '응원단장');
  if (cheers.length === 0) return;
  const soldiers = players.filter(p => p.team === team && p.name === '일반 병사');
  for (const s of soldiers) {
    let cnt = 0;
    for (const c of cheers) {
      const d = Math.abs(c.x - s.x) + Math.abs(c.y - s.y);
      if (d <= (c.range ?? 0)) cnt++;
    }
    if (cnt > 0) {
      s.power = +( (s.power ?? 0) + cnt ).toFixed(3);
      s._cheerBuffTeam = team;
      s._cheerBuffVal  = cnt;   // 같은 팀 응원단장 여러 명이면 합산
    }
  }
}

  // 말 생성 (블레이즈 & 엠버는 일반 드래프트처럼 블레이즈/엠버 두 유닛으로 나뉘어 등장)
  if (name === '블레이즈 & 엠버') {
    const p = getTeamStartPos(t);
    players.push(createBlazeUnit(t, p.x, p.y));
    players.push(createEmberUnit(t, p.x, p.y));
  } else {
    const unit = createSpecialUnitByName(name, t);
    if (unit) players.push(unit);
  }
  // 현재 라운드 풀/전역 taken 갱신
  randomDraft.pool = randomDraft.pool.filter(n => n !== name);
  randomDraft.taken.add(name);                 // ⬅️ 이후 라운드에서 제외
  // 다음 플레이어
  randomDraft.idx++;
  // 라운드 종료?
  if (randomDraft.idx >= 4) {
    // 다음 라운드 존재(총 4라운드)
    if (randomDraft.round < 3) {
      randomDraft.round += 1;
      randomDraft.order = rotatedOrder(randomDraft.round); // P2→P3→P4→P1...
      randomDraft.idx   = 0;
      randomDraft.pool  = makeRandomPool();
      // 남은 특수 병사가 0이면 조기 종료
      if (randomDraft.pool.length === 0) {
        randomDraft.active = false;
        popup.style.display = 'none';
        drawBoard();
        return;
      }
      renderRandomDraft();
      return;
    }
    // 마지막 라운드 종료
    randomDraft.active = false;
    popup.style.display = 'none';
    status && (status.textContent = '게임을 시작합니다!');
    drawBoard();
    return;
  }
  // 라운드 진행 중
  renderRandomDraft();
}

function rotatedOrder(start) { return [0,1,2,3].map((_,i)=> (start + i) % 4); }
function makeRandomPool() {
  const remain = ALL_SPECIAL_NAMES.filter(n => n !== '산타클로스' && !randomDraft.taken.has(n));
  // 남은 개수가 4 미만인 경우: 가능한 만큼만 제시(이 경우 자동으로 드래프트가 조기 종료될 수 있음)
  const need = Math.min(4, remain.length);
  for (let i = remain.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [remain[i], remain[j]] = [remain[j], remain[i]];
  }
  return remain.slice(0, need);
}

  }

  applyStep(piece, dx, dy);

  }

function onNetMsg(msg){
  if (!msg || typeof msg !== 'object') return;
  
  try {
    switch (msg.t) {
      case 'HELLO': {
        if (msg.from) {
          if (msg.nick) nickMap.set(msg.from, msg.nick);
          
          if (Array.isArray(msg.peers)) {
            for (const peerId of msg.peers) {
              if (conns.has(peerId) || peerId === myPeerId) continue;
              const conn = peer.connect(peerId, { reliable: true });
              setupConn(conn);
            }
          }
          
          const myConn = conns.get(msg.from);
          if (myConn && myConn.open) {
            myConn.send({ 
              t: 'PEER_LIST', 
              from: myPeerId, 
              peers: Array.from(conns.keys()).filter(p => p !== msg.from) 
            });
          }

        }
        pruneOwnersForConnectedPeers();
        break;
      }
      
      case 'PEER_LIST': {
        if (Array.isArray(msg.peers)) {
          for (const peerId of msg.peers) {
            if (conns.has(peerId) || peerId === myPeerId) continue;
            const conn = peer.connect(peerId, { reliable: true });
            setupConn(conn);
          }
        }
        break;
      }
      
      case 'ASK_SYNC': {
        if (myPeerId === anchorId()) {
          broadcast({ t:'SYNC', state: toRoomState(), hash: hashState() });
        }
        break;
      }
      
      case 'SYNC': {
        try { 
          applyRoomState(msg.state); 
        } catch(e){ 
          console.warn('SYNC apply failed', e); 
        }
        break;
      }
      case 'OWNERS': {
  owners = msg.owners || owners || {};
  // 단일팀 소유 규칙 유지
  enforceSingleTeamOwnership();
  renderTeamSlots();
  if (specialDraft?.active) {
    try { renderSpecialDraft(); } catch(e){}
  }
  // 앵커에서 정제된 owners 재배포(레이스 방지)
  if (online && myPeerId === anchorId()) {
    try { broadcast({ t:'OWNERS', owners }); } catch(e){}
  }
  updateDraftWaitingStatus();

  break;
}

      case 'ACTION': {
        if (msg.turn !== currentTurn || msg.round !== currentRound) {
          broadcast({ t:'ASK_SYNC', from: myPeerId });
          return;
        }
        if (owners?.[String(currentTurn)] && owners[String(currentTurn)] !== msg.from) return;
        
        if (msg.type === 'ROLL') {
          const r = msg.payload?.result ?? 1;
          applyRoll(r);
        } else if (msg.type === 'MOVE') {
          handleRemoteMove?.(msg.payload);
        } else if (msg.type === 'SKILL') {
          handleRemoteSkill?.({ ...msg.payload, from: msg.from });
        } else if (msg.type === 'ENDTURN') {
          endTurn();
        }
        break;
      }
      
      case 'HOST': {
        __hostId = msg.hostId || __hostId;
        updateStartBtnLock();
        break;
      }
            case 'START': {
        try { popup.dataset.lock = '0'; } catch(e){}
        // 호스트만 모드 선택 UI를 띄움. 게스트는 대기 안내만.
        if (myPeerId && __hostId && myPeerId === __hostId) {
          try { startModeSelection(); } catch(e){}
        } else {
          modeSelect.active = true;
          popup.dataset.lock = '1';
          popup.innerHTML = '<p class="font-bold mb-2">호스트가 게임 방식을 선택 중입니다…</p><p class="text-sm opacity-80">잠시만 기다려 주세요.</p>';
          popup.style.left = '50%';
          popup.style.top  = '50%';
          popup.style.transform = 'translate(-50%, -50%)';
          popup.style.display = 'block';
        }
        break;
      }
      case 'WINMODE_PROMPT': {
        // 호스트가 드래프트 모드(일반/랜덤)를 선택 중 — 게스트에게만 대기 화면 표시
        if (!(myPeerId && __hostId && myPeerId === __hostId)) {
          winModeSelect.active = true;

          popup.innerHTML = '<p class="font-bold mb-2">호스트가 드래프트 모드를 선택 중입니다…</p><p class="text-sm opacity-80">잠시만 기다려 주세요.</p>';
          popup.style.left = '50%';
          popup.style.top  = '50%';
          popup.style.transform = 'translate(-50%, -50%)';
          popup.style.display = 'block';
        }
        break;
      }
case 'DRAFT_READY': {
  try {
    // 모든 클라이언트: UI 카운트 갱신

  }
  break;
}

      case 'DRAFT_FINALIZE': {
        try { 
          finalizeSpecialDraft(); 
        } catch(e){
          console.warn('DRAFT_FINALIZE error:', e);
        }
        if (typeof renderSpecialDraft === 'function') {
          try { 
            renderSpecialDraft();

        if (isAnchor && typeof isAnchor === 'function' && isAnchor()) {
          const state = toRoomState();
          broadcast({ t: 'SYNC', state, hash: hashState() });
        }
        break;
      }
      
      default: 
        break;
    }
  } catch(e) {
    console.error('onNetMsg error:', e, msg);
  }
}

  function removeTitleScreen(){
    titleScreen.style.transition = 'opacity 0.25s ease';

        }
      });

function renderSkillMenu() {

  }

  // 선택된 말이 성이면: 성의 스킬(부대 이동) 전용 화면으로 분기
  const focused = players.find(p => p.id === selectedPlayerId);

    castleMove.selectedIds = new Set();
    renderCastleMovePicker(focused);
    return;
  }

  // 선택 특수 병사 우선(있으면 그 병사만), 없으면 팀 전체 특수 병사
  let units = players.filter(p => p.team === currentTurn && isSpecialUnit(p));
  if (focused && focused.team === currentTurn && isSpecialUnit(focused)) {
    units = [focused];
  }

  if (units.length === 0) {
    skillPopup.innerHTML = '<p class="text-center text-lg">사용 가능한 스킬이 없습니다</p>';
    centerPopup(skillPopup);
    return;
  }

  skillPopup.innerHTML = '<h2 class="text-2xl font-bold mb-4 text-center">🎯 스킬 목록</h2>';
let availableSkills = getAvailableSkills(units);
// 왜: 선택 병사 기준으로 0개면 빈 화면처럼 보임 → 팀 전체 특수 병사 스킬로 폴백
if (units.length === 1 && availableSkills.length === 0) {
  const teamUnits = players.filter(p => p.team === currentTurn && isSpecialUnit(p));
  availableSkills = getAvailableSkills(teamUnits);
}

  if (availableSkills.length === 0) {
    const p = document.createElement('p');
    p.className = 'text-center text-lg';
    p.textContent = '현재 사용 가능한 스킬이 없습니다';
    skillPopup.appendChild(p);
  } else {
    availableSkills.forEach(skill => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'block w-full text-left px-4 py-3 rounded-lg mb-2';
      btn.disabled = !skill.available;

      const header = document.createElement('div');
      header.className = 'font-bold text-lg mb-1';
      header.textContent = `${skill.icon} ${skill.unitName} — ${skill.skillName}`;

      const desc = document.createElement('div');
      desc.className = 'text-sm opacity-90';
      desc.textContent = skill.description;

      const condition = document.createElement('div');
      condition.className = 'text-xs mt-1 opacity-75';
      condition.textContent = skill.condition;

      btn.appendChild(header);
      btn.appendChild(desc);
      btn.appendChild(condition);

      if (skill.available) {
        // 왜: 스킬 실행 시 팝업 닫기 및 버튼 라벨 되돌리기
        // (단, 그림자 교환처럼 실행 후에도 skillPopup에서 대상 선택 UI를 계속 보여줘야 하는 스킬은 닫지 않음)
        btn.onclick = () => {
          executeSkill(skill);
          if (!shadowSwap.active) {
            skillPopup.style.display = 'none';
            skillMenuBtn.textContent = '스킬창';
          }
        };
      }

      skillPopup.appendChild(btn);
    });
  }

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'block w-full px-4 py-2 rounded-lg mt-4 bg-red-500 hover:bg-red-600';
  closeBtn.textContent = '닫기';
  closeBtn.onclick = () => {
    skillPopup.style.display = 'none';
    skillMenuBtn.textContent = '스킬창';
  };
  skillPopup.appendChild(closeBtn);

  // 마지막에 위치만 맞춰준다
  centerPopup(skillPopup);
}

function buyTycoonSoldier(team) {
  const cost = TYCOON_CONFIG.soldierBaseCost + TYCOON_CONFIG.soldierCostPerExisting * (tycoonBuys.soldier[team] || 0);
  if ((teamGold[team] || 0) < cost) return;
  teamGold[team] -= cost;
  const corner = getTeamCorner(team);
  const soldier = {
    id: `p${team+1}-s-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
    name: '일반 병사', x: corner.x, y: corner.y,
    color: colors[team], power: 1, team, movement: 1, range: 0
  };
  applyTycoonUnitBonuses(soldier);
  players.push(soldier);
  tycoonBuys.soldier[team] = (tycoonBuys.soldier[team] || 0) + 1;
  status && (status.textContent = '일반 병사를 영입했습니다');
  drawBoard();
  renderShopMenu();
  tycoonBroadcastSync();
}
function buyTycoonRandomSpecial(team) {
  const owned = new Set(players.filter(p => p.team === team).map(p => p.name));
  const pool = ALL_SPECIAL_NAMES.filter(n => !owned.has(n));
  if (pool.length === 0) return;
  if ((teamGold[team] || 0) < TYCOON_CONFIG.randomSpecialCost) return;
  teamGold[team] -= TYCOON_CONFIG.randomSpecialCost;
  const name = pool[Math.floor(Math.random() * pool.length)];
  const unit = createSpecialUnitByName(name, team);
  if (unit) {
    applyTycoonUnitBonuses(unit);
    players.push(unit);
    markSpecialTags?.();
  }
  status && (status.textContent = `${name}을(를) 영입했습니다`);
  drawBoard();
  renderShopMenu();
  tycoonBroadcastSync();
}
function buyTycoonChosenSpecial(team, name) {
  const owned = new Set(players.filter(p => p.team === team).map(p => p.name));
  if (owned.has(name)) return;
  if ((teamGold[team] || 0) < TYCOON_CONFIG.chosenSpecialCost) return;
  teamGold[team] -= TYCOON_CONFIG.chosenSpecialCost;
  const unit = createSpecialUnitByName(name, team);
  if (unit) {
    applyTycoonUnitBonuses(unit);
    players.push(unit);
    markSpecialTags?.();
  }
  status && (status.textContent = `${name}을(를) 영입했습니다`);
  drawBoard();
  renderShopMenu();
  tycoonBroadcastSync();
}
function buyTycoonPowerBoost(team) {
  const cost = TYCOON_CONFIG.powerBoostBaseCost + TYCOON_CONFIG.powerBoostCostStep * (tycoonBuys.power[team] || 0);
  if ((teamGold[team] || 0) < cost) return;
  teamGold[team] -= cost;
  tycoonPowerBonus[team] = +(((tycoonPowerBonus[team] || 0) + TYCOON_CONFIG.powerBoostAmount)).toFixed(3);
  for (const u of players) {
    if (u.team === team) u.power = +(((u.power || 0) + TYCOON_CONFIG.powerBoostAmount)).toFixed(3);
  }
  tycoonBuys.power[team] = (tycoonBuys.power[team] || 0) + 1;
  status && (status.textContent = '전투력이 강화되었습니다 (+0.5)');
  drawBoard();
  renderShopMenu();
  tycoonBroadcastSync();
}
function buyTycoonMoveBoost(team) {
  const cost = TYCOON_CONFIG.moveBoostBaseCost + TYCOON_CONFIG.moveBoostCostStep * (tycoonBuys.move[team] || 0);
  if ((teamGold[team] || 0) < cost) return;
  teamGold[team] -= cost;
  tycoonMoveMult[team] = Math.round((tycoonMoveMult[team] ?? 1) * TYCOON_CONFIG.moveBoostFactor * 100) / 100;
  reapplyTycoonMoveBonusForTeam(team);
  tycoonBuys.move[team] = (tycoonBuys.move[team] || 0) + 1;
  status && (status.textContent = '이동력이 강화되었습니다 (이동 소모 -25%)');
  drawBoard();
  renderShopMenu();
  tycoonBroadcastSync();
}

function beginMerchantTrade(merchant) {
  if (!merchant) { status && (status.textContent = '상인: 대상 없음'); return; }
  if (merchant._usedThisTurn) { status && (status.textContent = '상인: 이번 턴에 이미 사용'); return; }

  const team = merchant.team;

  // 희생 후보: 같은 팀, 본인/왕/성 제외, 판 위에 존재
  const candidates = players.filter(u =>
    u.team === team &&
    u.id !== merchant.id &&
    u.name !== '왕' &&
    !(typeof isCastle === 'function' && isCastle(u)) &&
    Number.isInteger(u.x) && Number.isInteger(u.y) && u.x >= 0 && u.y >= 0
  );

  if (candidates.length === 0) {
    status && (status.textContent = '상인: 희생할 아군이 없습니다');
    return;
  }

  // 스냅샷 먼저
  pushSnapshot('skill:merchant');

  // 무작위 희생
  const victim = candidates[Math.floor(Math.random() * candidates.length)];
  const vx = victim.x, vy = victim.y;
  const victimName = displayName(victim);

  // 특수(45%) / 일반(55%)
  let newUnit = null;
  if (Math.random() < 0.45) {
    // ✅ ‘블레이즈 & 엠버’ 제외 / ‘블레이즈’, ‘엠버’ 각각 포함
    const specialPool = [
      '저격수','기자','고목','사신','사육사','건축가','닌자','범고래','수레꾼',
      '의사','좀비','도박사','눈사람','폼트랜서','광대','스키퍼','여왕개미','상인',
      '응원단장','트럭 운전사','블레이즈','엠버','개미','비숍','산타클로스','샤워기'
    ];
    const pick = specialPool[Math.floor(Math.random() * specialPool.length)];
    newUnit = createSpecialUnitByName(pick, team);
  } else {
    // 일반 병사 생성기 (프로젝트 컨벤션에 맞게 조정)
    newUnit = {
      id: `p${team+1}-m-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
      name: '일반 병사',
      team, x: vx, y: vy,
      color: getTeamColor ? getTeamColor(team) : undefined,
      power: 1, movement: 1, range: 0
    };
  }

  // 희생 → 소환
  removePlayer(victim, true);
  if (newUnit) { newUnit.x = vx; newUnit.y = vy; players.push(newUnit); }

  merchant._usedThisTurn = true;

  const tradeMsg = `상인: ${victimName} 제거 → ${newUnit ? newUnit.name : '실패'}`;
  showCenterMessage?.(tradeMsg, 2000);
  flashCell?.(vx, vy, 1000);
  drawBoard?.();
  // executeSkill()이 이후에 status를 일반 문구로 덮어쓰므로, 그 다음 틱에 거래 결과로 다시 덮어쓴다
  setTimeout(() => { status && (status.textContent = tradeMsg); }, 0);
  setTimeout(() => { drawBoard(); }, 2000);

  if (online) {
    const state = toRoomState();
    broadcast({ t: 'SYNC', state, hash: hashState() });
  }
}
function getAvailableSkills(units) {
  const skills = [];
  const canBuildCastle = (u) =>
    (countCastles(u.team) < 5) &&
    !hasCastleAt(u.team, u.x, u.y) &&
    !cellOccupied(u.x, u.y);

  units.forEach((unit) => {
    const name = unit.name;
    // ⑫ 비숍: 대각선 질주
if (name === '비숍' && unit.team === currentTurn) {
  skills.push({
    icon: '♗',
    unitName: '비숍',
    skillName: '대각선 질주',
    description: '이번 차례에 한 번, 대각선으로 몇 칸이든 이동(경로 첫 점유칸 뒤는 불가).',
    condition: '차례당 1회',
    available: !unit._usedThisTurn,
    execute: () => {
      bishopDash.active = true;
      bishopDash.unitId = unit.id;
      if (popup) popup.style.display = 'none';
      status && (status.textContent = '대각선 목적지 칸을 클릭하세요');
    }
  });
}
    // ⑬ 샤워기: 웅덩이 만들기
    if (name === '샤워기' && unit.team === currentTurn) {
      const blockedByMate = players.some(p =>
        p.id !== unit.id && p.x === unit.x && p.y === unit.y && !canStandOnWaterPuddle(p)
      );
      const can = (currentRound % 3 === 0) && !unit._usedThisTurn && !blockedByMate;
      skills.push({
        icon: '🚿',
        unitName: '샤워기',
        skillName: '웅덩이 만들기',
        description: "현재 칸을 '물 웅덩이'로 만듭니다. 샤워기·개구리·고목·범고래 외의 말은 물 웅덩이 위에 있을 수 없습니다.",
        condition: '3턴마다 사용 가능',
        available: can,
        execute: () => {
          if (!isWaterPuddle(unit.x, unit.y)) waterPuddles.push({ x: unit.x, y: unit.y });
          unit._usedThisTurn = true;
          updateShowerPressureBuff();
          drawBoard();
        }
      });
    }
    // ⑭ 그림자 군주: 그림자 추출 (자신이 서 있는 칸에 그림자가 있을 때)
    if (name === '그림자 군주' && unit.team === currentTurn) {
      const marker = shadowMarkers.find(s => s.x === unit.x && s.y === unit.y);
      if (marker) {
        skills.push({
          icon: '👻',
          unitName: '그림자 군주',
          skillName: '그림자 추출',
          description: `이 칸의 그림자(${marker.unitName})를 추출합니다. 일반 병사의 그림자는 100%, 특수 병사의 그림자는 30% 확률로 아군이 됩니다.`,
          condition: '그림자가 있는 칸에서 사용 가능',
          available: true,
          execute: () => { performShadowExtraction(unit, marker); }
        });
      }
    }
    // ⑮ 그림자 군주: 그림자 교환 (차례당 2회, 그림자 태그를 가진 아군과 위치 교환)
    if (name === '그림자 군주' && unit.team === currentTurn) {
      const usesLeft = 2 - (unit._shadowSwapUses || 0);
      const hasTarget = players.some(p =>
        p.team === unit.team && p.id !== unit.id &&
        Array.isArray(p.tags) && p.tags.includes('그림자') &&
        p.x >= 0 && p.y >= 0
      );
      skills.push({
        icon: '🌑',
        unitName: '그림자 군주',
        skillName: '그림자 교환',
        description: '그림자 태그를 가진 아군 하나와 자신의 위치를 서로 바꿉니다.',
        condition: `차례당 2회 (남은 ${Math.max(0, usesLeft)}회)`,
        available: usesLeft > 0 && hasTarget,
        execute: () => { beginShadowSwap(unit); }
      });
    }
    // ① 기자: 특종 (5턴마다, 자기 위치로 아군 집결)
    if (name === '기자') {
      const can = (currentRound % 5 === 0) && (unit._lastGatherRound !== currentRound);
      skills.push({
        icon: '📰',
        unitName: '기자',
        skillName: '특종',
        description: '모든 아군을 기자의 위치로 소환합니다.',
        condition: '5턴마다 사용 가능',
        available: can,
        execute: () => {
          const tx = unit.x, ty = unit.y;
          for (const u of players) {
            if (u.team === unit.team && u.id !== unit.id) {
              u.x = tx; u.y = ty;
            }
          }
          unit._lastGatherRound = currentRound;
          drawBoard();
        }
      });
    }

    // ② 사육사/코끼리/고양이/개구리: 대신 싸우기 (2턴마다 변신 메뉴)
    if (name === '사육사' || name === '코끼리' || name === '고양이' || name === '개구리') {
      const can = (currentRound % 2 === 0);
      skills.push({
        icon: '🦁',
        unitName: name,
        skillName: '대신 싸우기',
        description: '동물 형태로 변신합니다.',
        condition: '2턴마다 사용 가능',
        available: can,
        execute: () => { beginKeeperChoice(unit); }
      });
    }

    // ③ 건축가: 성 쌓기
    if (name === '건축가') {
      const can = (currentRound % 2 === 0) && unit._castleBuiltRound !== currentRound;
      skills.push({
        icon: '🏗️',
        unitName: '건축가',
        skillName: '성 쌓기',
        description: '현재 위치에 성을 즉시 건설합니다.',
        condition: '짝수 턴마다 1회 사용 가능',
        available: can,
        execute: () => { addCastle(unit.team, unit.x, unit.y); unit._castleBuiltRound = currentRound; drawBoard(); }
      });
    }

    // ④ 닌자: 침투
    if (name === '닌자' || name === '숙련된 닌자') {
      const can = (currentRound % 3 === 0) && isAlone(unit) && !ninjaSwappedThisTurn;
      skills.push({
        icon: '🥷',
        unitName: name,
        skillName: '침투',
        description: '사거리 내 적과 위치를 바꿉니다.',
        condition: '3턴마다, 혼자 있을 때 사용 가능',
        available: can,
        execute: () => { beginNinjaSwap(unit); }
      });
    }

    // ⑤ 수레꾼: 손님 받아라
    if (name === '수레꾼') {
      skills.push({
        icon: '🛒',
        unitName: '수레꾼',
        skillName: '손님 받아라',
        description: '같은 칸의 아군과 연결하여 함께 이동합니다.',
        condition: '항상 사용 가능',
        available: true,
        execute: () => { beginCartLink(unit); }
      });
    }

    // ⑥ 폼트랜서: 변신
    if (name === '폼트랜서' || name === '폼트렌서') {
      const can = (currentRound % 3 === 0);
      skills.push({
        icon: '🎭',
        unitName: '폼트랜서',
        skillName: '변신',
        description: '특수 병사로 변신합니다(차례 종료 시 원복).',
        condition: '3턴마다 사용 가능',
        available: can,
        execute: () => { beginFormPick(unit); }
      });
    }

    // ⑦ 스키퍼: 턴 스킵
    if (name === '스키퍼') {
      const can = diceRolledThisTurn && !unit._usedThisTurn && lastDiceRoll >= 6;
      skills.push({
        icon: '⏭️',
        unitName: '스키퍼',
        skillName: '턴 스킵',
        description: '턴 수를 1~5 증가시킵니다.',
        condition: '주사위 6 이상일 때, 차례당 1회',
        available: can,
        execute: () => { beginTricksterMenu(unit); }
      });
    }

    // ⑧ 여왕개미: 개미 다루기
    if (name === '여왕개미') {
      const can = (currentRound % 4 === 0) && !unit._usedThisTurn;
      skills.push({
        icon: '👑',
        unitName: '여왕개미',
        skillName: '개미 다루기',
        description: '개미 3마리 소환 또는 모든 아군 개미 전투력 +0.25.',
        condition: '4턴마다 사용 가능',
        available: can,
        execute: () => { beginQueenMenu(unit); }
      });
    }

    // ⑨ 상인: 거래 (오류 수정됨)
    if (name === '상인') {
        skills.push({
          icon: '💰',
          unitName: '상인',
          skillName: '거래',
          description: '아군 하나를 희생하여 새로운 유닛을 소환합니다.',
          condition: '차례당 1회',
          available: !unit._usedThisTurn,
          execute: () => beginMerchantTrade(unit)
        });
    }

    // ⑩ 트럭 운전사: 2D 세카이
    if (name === '트럭 운전사') {
      const can = (currentRound % 5 === 0) && ((unit._dirStreak || 0) >= 2) && !unit._truckUsedThisTurn;
      skills.push({
        icon: '🚚',
        unitName: '트럭 운전사',
        skillName: '2D 세카이로 보내기',
        description: '현재 위치 기준 반경 2칸 유닛을 즉시 잠시 제외합니다.',
        condition: '5턴마다, 직전 2회 연속 같은 방향으로 이동한 후 사용 가능',
        available: can,
        execute: () => {
          unit._truckUsedThisTurn = true;
          unit._dirStreak = 0; // 스킬 사용 후 방향 스트릭 초기화(재사용하려면 다시 2연속 이동 필요)

          // 트럭 운전사 현재 위치 기준 반경 2칸(맨해튼 거리) 이내의 유닛을 즉시 잠시 제외
          const nearby = players.filter(p =>
            p.id !== unit.id &&
            p.x >= 0 && p.y >= 0 &&
            (Math.abs(p.x - unit.x) + Math.abs(p.y - unit.y)) <= 2
          );
          banishUnits(nearby, 2, unit.id);

          if (popup) popup.style.display = 'none';
          drawBoard();
        }
      });
    }

    // ⑪ 엠버: 블레이즈와 연결
    if (name === '엠버') {
      const sameCellBlaze = players.find(p => p.team === unit.team && p.name === '블레이즈' && p.x === unit.x && p.y === unit.y && p.x >= 0);
      if (sameCellBlaze && unit._linkedBlazeId !== sameCellBlaze.id) {
        skills.push({
          icon: '🔗',
          unitName: '엠버',
          skillName: '블레이즈와 연결',
          description: '블레이즈와 연결합니다. 연결된 동안 엠버가 이동하는 칸에 블레이즈가 함께 따라옵니다. 서로 다른 칸에 있게 되면 연결이 풀립니다.',
          condition: '블레이즈와 같은 칸에 있을 때',
          available: true,
          execute: () => {
            unit._linkedBlazeId = sameCellBlaze.id;
            drawBoard();
          }
        });
      }
    }

    // 엠버: 블레이즈 육성
    if (name === '엠버') {
      const hasBlaze = players.some(p => p.team === unit.team && p.name === '블레이즈' && p.x >= 0 && p.y >= 0);
      if (!hasBlaze && !unit._grownUsed) {
        const canPromote = players.some(u => u.team === unit.team && u.name === '일반 병사' && u.x >= 0 && u.y >= 0);
        skills.push({
          icon: '🔥',
          unitName: '엠버',
          skillName: '블레이즈 육성',
          description: '아군 일반 병사를 블레이즈로 전직시키고 그 위치로 이동합니다.',
          condition: '팀에 블레이즈가 없을 때 1회',
          available: canPromote,
          execute: () => {
            const cands = players.filter(u => u.team === unit.team && u.name === '일반 병사' && u.x >= 0 && u.y >= 0);
            if (cands.length === 0) { if (status) status.textContent = '전직할 일반 병사가 없습니다'; return; }
            const target = cands[Math.floor(Math.random() * cands.length)];
            unit.x = target.x; unit.y = target.y;
            target.name = '블레이즈';
            target.type = 'blaze';
            target.power = 1; target.range = 0; target.movement = 1;
            if (!Array.isArray(target.tags)) target.tags = [];
            if (!target.tags.includes('특수 병사')) target.tags.push('특수 병사');
            unit._grownUsed = true;
            updateBlazeEmberAura();
            drawBoard();
          }
        });
      }
    }
  });

  // 조건을 만족하지 못하는 특수 병사들도 목록에 표시 (비활성 상태)
  units.forEach((unit) => {
    if (!isSpecialUnit || !isSpecialUnit(unit)) return;
    const hasAny = skills.some(s => s.unitName === unit.name);
    if (!hasAny) {
      skills.push({
        icon: '🔒',
        unitName: unit.name,
        skillName: '스킬/패시브',
        description: '현재 사용 가능한 액티브 스킬이 없거나 패시브 유닛입니다.',
        condition: '사용 불가',
        available: false
      });
    }
  });

  return skills;
}
function updateBlazeEmberAura() {
  const teams = new Set(players.filter(u => u.name === '블레이즈' || u.name === '엠버').map(u => u.team));
  for (const t of teams) {
    const blazes = players.filter(u => u.team === t && u.name === '블레이즈' && u.x >= 0 && u.y >= 0);
    const embers = players.filter(u => u.team === t && u.name === '엠버'   && u.x >= 0 && u.y >= 0);

    // 모든 블레이즈에 대해 같은 칸의 엠버 존재 여부로 버프·해제
    for (const b of blazes) {
      const sameCellEmber = embers.some(e => e.x === b.x && e.y === b.y);
      if (sameCellEmber) {
        b._emberBoosted = true;
        b.power = 4;
        b.movement = 0;
      } else if (b._emberBoosted) {
        b._emberBoosted = false;
        b.power = 1;
        b.movement = 1;
      }
    }

    // 엠버-블레이즈 연결: 서로 다른 칸에 있게 되면 연결 해제
    for (const e of embers) {
      if (!e._linkedBlazeId) continue;
      const linkedBlaze = players.find(u => u.id === e._linkedBlazeId);
      if (!linkedBlaze || linkedBlaze.x !== e.x || linkedBlaze.y !== e.y || linkedBlaze.x < 0) {
        e._linkedBlazeId = null;
      }
    }
  }
}
function executeSkill(skill) {
  pushSnapshot(`skill:${skill?.skillName || 'unknown'}`);
  if (skill.execute) {
    skill.execute();
    // 비숍/그림자 교환처럼 후속 클릭·선택을 기다리는 스킬은 자체 안내 문구를 유지시킨다
    if (!bishopDash.active && !shadowSwap.active) {
      status && (status.textContent = `${skill.icon} ${skill.unitName} — ${skill.skillName} 사용!`);
    }
    drawBoard?.();
    if (online) {
      const state = toRoomState();
      broadcast({ t: 'SYNC', state, hash: hashState() });
    }
  }
}
function centerPopup(popupEl) {
  popupEl.style.left = '50%';
  popupEl.style.top = '50%';
  popupEl.style.transform = 'translate(-50%, -50%)';
}
(function enableBoardPanningAndCentering(){
  const wrap = document.getElementById('boardWrapper');
  const grid = document.getElementById('board');
  if (!wrap || !grid) return;

  function centerBoard() {
    setTimeout(() => {
      wrap.scrollLeft = Math.max(0, (grid.scrollWidth  - wrap.clientWidth)  / 2);
      wrap.scrollTop  = Math.max(0, (grid.scrollHeight - wrap.clientHeight) / 2);
    }, 0);
  }
  window.addEventListener('load', centerBoard);
  window.addEventListener('resize', centerBoard);

  let dragging = false, sx = 0, sy = 0, sl = 0, st = 0, pid = null, armed = false;
wrap.addEventListener('pointerdown', (e) => {
if (e.target.closest('#popup') || e.target.closest('button')) return;
pid = e.pointerId;
wrap.setPointerCapture(pid);
sx = e.clientX; sy = e.clientY; sl = wrap.scrollLeft; st = wrap.scrollTop;
armed = true; dragging = false;
});
wrap.addEventListener('pointermove', (e) => {
if (!armed) return;
const dx0 = e.clientX - sx, dy0 = e.clientY - sy;
if (!dragging) {
if (Math.abs(dx0) + Math.abs(dy0) > 3) dragging = true; // 임계값
else return;
}
wrap.scrollLeft = sl - dx0;
wrap.scrollTop = st - dy0;
});
const end = (ev) => {
  const wasArmed = armed;
  const wasDragging = dragging;

  armed = false;
  if (!pid) return;
  try { wrap.releasePointerCapture(pid); } catch(e){}
  pid = null;
  dragging = false;

  // 드래그가 아닌 '탭/클릭'이면, click 이벤트를 합성해 보드 셀의 클릭 핸들러가 확실히 실행되도록 보장
  if (wasArmed && !wasDragging && ev && typeof ev.clientX === 'number' && typeof ev.clientY === 'number') {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    if (el) {
      el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
    }
  }
};
wrap.addEventListener('pointerup', (e) => end(e));
wrap.addEventListener('pointercancel', (e) => end(e));
wrap.addEventListener('pointerleave', (e) => end(e));
})();
