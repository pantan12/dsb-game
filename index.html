  /* === 반응형 셀 크기 & 스크롤 가능 래퍼 === */
:root { --cell: 4rem; }                 /* 기본 PC 셀 크기 */
#board { 
  display: grid; 
  grid-template-columns: repeat(14, var(--cell));
  grid-template-rows:    repeat(14, var(--cell));
  gap: 0.25rem; 
}
#boardWrapper{
  overflow-x: auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  /* ✨ 포인터 제스처 충돌 방지: 드래그 스크롤 스크립트가 제어 */
  touch-action: pan-x pan-y;

  display: flex;
  justify-content: flex-start;
  align-items: flex-start;

  max-width: 100vw;
  max-height: calc(100vh - 200px);
  flex: 1 1 auto;
  min-height: 0;

  padding: 0.5rem;
}
#boardWrapper { position: relative; }
@media (max-width: 640px){
  :root { --cell: 2.5rem; }            /* 모바일 셀 크기 축소 */
}
/* 하단 고정 HUD가 상태 텍스트를 가리지 않도록 본문 하단 여백 확보 */
body { padding-bottom: 4.5rem; }
@media (max-width: 640px){
  body { padding-bottom: 3.5rem; }
}
/* ===== HUD: 모바일 컴팩트 + 접기 ===== */
#hudBar { transition: transform .25s ease; }

/* UI 숨김 토글 시: HUD만 하단으로 살짝 접어서 보드가 더 내려오도록 */
.ui-hidden #hudBar {
  transform: translateY(calc(100% - 40px));  /* 40px 만큼만 손잡이처럼 남김 */
}

/* 모바일에서 버튼/여백 축소 */
@media (max-width: 640px){
  #hudBar .mx-auto { padding-left: 0.5rem; padding-right: 0.5rem; }
  #hudBar .px-3.py-2 { padding: 0.375rem 0.5rem; } /* 버튼 컴팩트 */

  padding: 0.75rem 1rem;
  border-radius: 0.5rem;
  border: 1px solid rgba(0,0,0,0.1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);

/* 팝업 내부 버튼/텍스트도 일괄 가독성 보장 */
#popup * { color: #111; } /* body의 text-white보다 우선(ID 선택자) */

  background: #fff;

  background: #e5e7eb;            /* hover:bg-gray-200와 동일 톤 */

  <script>
    // ============ ONLINE CORE ============
let app = null, db = null;
let isHost = false;
let myNick = localStorage.getItem('multi_nick') || '';
  const nickMap = new Map();             // peerId -> nickname
  function getMyNick() {
    const v = (nameInput?.value?.trim?.() || myNick || '');
    return v || '플레이어';
  }
let myId = localStorage.getItem('multi_myId') || Math.random().toString(36).slice(2,10);
localStorage.setItem('multi_myId', myId);
let roomId = null;
let roomRef = null;
let roomUnsub = null;
const teamSlots = document.getElementById('teamSlots');
const myPeerIdLabel = document.getElementById('myPeerIdLabel');
const bishopDash = { active: false, unitId: null }; // 비숍 스킬 모드
// 비숍 대각선 질주: 현재 이동 가능한 칸 목록(첫 점유 칸까지 포함, 그 이후는 불가)
function getBishopDashReachableCells(unit) {
  const cells = [];
  const dirs = [[1,1],[1,-1],[-1,1],[-1,-1]];
  for (const [dx, dy] of dirs) {
    let cx = unit.x + dx, cy = unit.y + dy;
    while (cx >= 0 && cx < size && cy >= 0 && cy < size) {
      if (typeof isEnteringEnemyFrog === 'function' &&
          isEnteringEnemyFrog(unit.x, unit.y, cx, cy, unit.team)) break;
      cells.push({ x: cx, y: cy });
      if (typeof cellOccupied === 'function' && cellOccupied(cx, cy)) break;
      cx += dx; cy += dy;
    }
  }
  return cells;
}
function renderTeamSlots(){
  if (!teamSlots) return;
  teamSlots.innerHTML = '';
  for (const t of [0,1,2,3]) {
    const owner = owners?.[String(t)] || null;
    const mine  = owner && myPeerId && owner === myPeerId;
    const label = owner
  ? (owner === myPeerId ? '나' : (nickMap.get(owner) || owner.slice(0,6)))
  : '비어있음';
    const btn = document.createElement('button');
    btn.className = `px-3 py-2 rounded border ${mine ? 'bg-emerald-500 text-black' : 'bg-gray-700 text-white'} w-full`;
    btn.textContent = `팀 ${t+1} • ${label}`;
    btn.onclick = ()=>{
  if (!online || !myPeerId) { alert('온라인 연결 후 이용하세요'); return; }
  if (!owners) owners = {};

  // 내가 이미 다른 팀을 점유 중인데, 그 팀이 아닌 곳을 누르면 거부
  if (owners[String(t)] !== myPeerId && ownsAnotherTeam(myPeerId, t)) {
    alert('한 기기에서는 한 팀만 점유할 수 있습니다. 먼저 기존 팀 점유를 해제하세요.');
    return;
  }

  // 동일 팀이면 토글(해제), 아니면 점유
  if (owners[String(t)] === myPeerId) {
    owners[String(t)] = null;
  } else {
    // 누군가 쓰고 있으면 점유 불가
    if (owners[String(t)] && owners[String(t)] !== myPeerId) {
      alert('이미 다른 사용자가 점유 중입니다');
      return;
    }
    owners[String(t)] = myPeerId;
  }

  // 안전장치: 단일팀 규칙 유지
  enforceSingleTeamOwnership();

  // 브로드캐스트 및 UI 갱신
  broadcast({ t:'OWNERS', owners });
  renderTeamSlots();
};

    teamSlots.appendChild(btn);
  }
}
function showTeamClaimUIForDraft() {
  popup.innerHTML = '<p class="font-bold mb-2">팀 배정이 필요합니다</p>';

  const alive = getAliveTeams();
  const list = document.createElement('div');

  alive.forEach(t => {
    const taken = owners && owners[String(t)];
    const label = taken ? `팀 ${t+1} (점유됨)` : `팀 ${t+1} (선택 가능)`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `block w-full text-left px-3 py-2 rounded mb-1 ${taken ? 'bg-gray-700 text-gray-300 cursor-not-allowed' : 'hover:bg-gray-200 hover:text-black'}`;
    btn.textContent = label;
    btn.disabled = !!taken;
    btn.onclick = () => {
  if (!online || !myPeerId) return;
  if (!owners) owners = {};
  if (owners[String(t)]) return;

  // 이미 다른 팀을 가진 경우 거부
  if (ownsAnotherTeam(myPeerId, t)) {
    alert('한 기기에서는 한 팀만 점유할 수 있습니다. 먼저 기존 팀을 해제하세요.');
    return;
  }

  owners[String(t)] = myPeerId;
  enforceSingleTeamOwnership();
  renderTeamSlots?.();
  if (online) {
    try { broadcast({ t:'OWNERS', owners }); } catch(e){}
    try { broadcast({ t:'SYNC', state: toRoomState(), hash: hashState() }); } catch(e){}
  }
  renderSpecialDraft();
};


    list.appendChild(btn);
  });

  if (alive.length === 0) {
    const p = document.createElement('p');
    p.className = 'text-sm text-gray-400';
    p.textContent = '선택 가능한 팀이 없습니다. 호스트가 팀을 정해 주세요.';
    popup.appendChild(p);
  } else {
    popup.appendChild(list);
  }

  popup.style.display = 'block';
  popup.style.left = '50%';
  popup.style.top = '50%';
  popup.style.transform = 'translate(-50%, -50%)';
  try { popup.dataset.lock = '1'; } catch(e){}
  try { popup.dataset.lock = '1'; } catch(e){}
}
setTimeout(renderTeamSlots, 0);
const mpStatus = document.getElementById('mpStatus');
const nameInput = document.getElementById('nameInput');
const roomInput = document.getElementById('roomInput');
const createRoomBtn = document.getElementById('createRoomBtn');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const startOnlineBtn = document.getElementById('startOnlineBtn');
const leaveRoomBtn = document.getElementById('leaveRoomBtn');
const localModeBtn = document.getElementById('localModeBtn');
const onlineModeBtn = document.getElementById('onlineModeBtn');

function randRoom(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
// 게스트가 호스트를 처음 찾는 단계에서만 쓰는 재시도 상태.
// (호스트가 "방 만들기"를 누른 직후엔 자기 Peer가 시그널링 서버에 등록되기까지
//  1~2초 정도 걸릴 수 있는데, 그 사이에 게스트가 코드를 입력해 접속을 시도하면
//  "peer-unavailable"(방을 찾을 수 없음) 오류가 남 — 실제로는 방이 없는 게 아니라
//  아직 준비 중인 것뿐이므로, 몇 차례 자동 재시도해서 이 경합을 흡수한다.)
let __joinRetryCount = 0;
const JOIN_MAX_RETRIES = 5;
const JOIN_RETRY_DELAY_MS = 1500;
// P2P (PeerJS)
let online = false;
let peer = null;          // 내 Peer

function setupConn(conn) {

  conn.on('open', () => {
    conn.send({ t: 'HELLO', from: myPeerId, nick: getMyNick(), peers: Array.from(conns.keys()) });
    conn.send({ t: 'ASK_SYNC', from: myPeerId });
    
    if (__hostId) conn.send({ t:'HOST', hostId: __hostId });
    
    mpStatus.textContent = `${roomCode} · 연결됨 (총 ${conns.size + 1}명)`;
  });
  
  conn.on('data', (data) => {
    onNetMsg(data);
  });
  
  conn.on('close', () => {
  conns.delete(conn.peer);
  nickMap.delete(conn.peer);

  // 해당 피어가 맡고 있던 팀 소유권 제거
  if (owners) {
    let changed = false;
    for (const k of Object.keys(owners)) {
      if (owners[k] === conn.peer) {
        owners[k] = null;
        changed = true;
      }
    }
    if (changed && online && myPeerId === anchorId()) {
      broadcast({ t: 'OWNERS', owners });
    }
  }

  // 드래프트 “준비됨” 신호에서도 제거
  try { draftSignals?.peersReady?.delete?.(conn.peer); } catch(e) {}

  // 남아있는 연결 기준으로 한 번 더 정리
  pruneOwnersForConnectedPeers();

  mpStatus.textContent = `${roomCode} · 연결됨 (총 ${conns.size + 1}명)`;
  updateDraftWaitingStatus();

});  
  conn.on('error', (e) => {
  console.warn('Connection error:', e);
  conns.delete(conn.peer);
  nickMap.delete(conn.peer);
  try { draftSignals?.peersReady?.delete?.(conn.peer); } catch(_) {}
  pruneOwnersForConnectedPeers();
});

function applyRemoteAction(msg) {
  // ① 차례/소유자 검증
  if (owners[String(currentTurn)] !== msg.from) return;       // 보낸 사람이 소유자 아님
  if (msg.turn !== currentTurn || msg.round !== currentRound) return; // 턴 불일치

  // ② 사전 상태 해시 비교(낙관적): 다르면 스냅샷 요청
  const nowHash = hashState();
  if (nowHash !== msg.pre) {
    // 내 상태가 비틀린 것 → 싱크 받자
    broadcast({ t: 'ASK_SYNC', from: myPeerId });
    return;
  }

  // ③ 타입별로 같은 로직 재현(결정적이어야 함)
  switch (msg.type) {
    case 'ROLL': 
    // 원격에서 받은 주사위 결과를 그대로 적용
    if (msg.payload && typeof msg.payload.result === 'number') {
      applyRoll(msg.payload.result);
    }
    break;
    case 'MOVE': handleRemoteMove(msg.payload); break;
    case 'SKILL': handleRemoteSkill(msg.payload); break;
    case 'ENDTURN': endTurn(); break;
  }

  // ④ 사후 해시 검증 (선택): 다르면 재싱크
  const after = hashState();
  if (after !== msg.post) {
    broadcast({ t:'ASK_SYNC', from: myPeerId });
  }
}
function handleRemoteSkill(payload){
  if (!payload || !payload.kind) return;

  // ① 특수 드래프트 선택 (SIMUL 모드 대응)
  if (payload.kind === 'DRAFT_PICK') {
    if (!specialDraft?.active) return;

    const team = payload.team;                    // ★ 원격에서 보낸 실제 팀
    if (team == null) return;

    // 온라인: 보낸 사람이 해당 팀 소유자여야 함
    if (online && owners?.[String(team)] && owners[String(team)] !== payload.from) return;

    // 이미 4개 채웠으면 무시
    if ((specialDraft.chosenCount?.[team] ?? 0) >= 4) return;

    // 유효 유닛인지 확인 (해당 팀 + 특수 병사)
    const u = players.find(p => p.id === payload.unitId && p.team === team && isSpecialUnit(p));
    if (!u) return;

    // 토글(선택/해제) 지원
    const wasChosen = specialDraft.chosenIds.has(u.id);
    const wantChoose = payload.toggle ? !wasChosen : true;

    if (wantChoose && !wasChosen) {
      specialDraft.chosenIds.add(u.id);
      specialDraft.chosenCount[team] = (specialDraft.chosenCount[team] || 0) + 1;
    } else if (!wantChoose && wasChosen) {
      specialDraft.chosenIds.delete(u.id);
      specialDraft.chosenCount[team] = Math.max(0, (specialDraft.chosenCount[team] || 0) - 1);
    }

    renderSpecialDraft();
    if (online && myPeerId === anchorId()) {
      const state = toRoomState();
      broadcast({ t: 'SYNC', state, hash: hashState() });
    }
    return;
  }
  if (payload.kind === 'DEPLOY_PLACE') {
    if (!deploy?.active) return;
    const team = payload.team;
    if (owners?.[String(team)] !== payload.from) return;

    const start = deploy.startPos.get(team);
    if (!start) return;

    const q = deploy.queueByTeam.get(team) || [];
    const u = q[0];
    if (!u || u.id !== payload.unitId) return;

    u.x = payload.x; u.y = payload.y;
    markJustPlaced(u.id);  // ⬅️ 이 줄 추가
    q.shift();
    deploy.queueByTeam.set(team, q);
    drawBoard();

    if (q.length === 0) advanceDeployTeam();
    if (online && myPeerId === anchorId()) {
      const state = toRoomState();
      broadcast({ t: 'SYNC', state, hash: hashState() });
    }
    return;
  }
}

function isOrthogonalNeighbor(ax, ay, bx, by) {

function makeOnCellClick(x, y, onCellPlayers) {
  return function onCellClick(e) {
    e.stopPropagation();
    if (gameEnded) { status && (status.textContent = '게임이 종료되었습니다'); return; }
    if (bishopDash.active) {
      const unit = players.find(p => p.id === bishopDash.unitId);
      bishopDash.active = false; // 클릭 1회로 종료
      if (!unit) { drawBoard(); return; }
      // 내 팀 턴만 허용
      if (unit.team !== currentTurn) { status && (status.textContent='자신의 차례가 아닙니다'); return; }

      const dx = x - unit.x, dy = y - unit.y;
      if (dx === 0 && dy === 0) { drawBoard(); return; }
      if (Math.abs(dx) !== Math.abs(dy)) { status && (status.textContent='대각선만 가능합니다'); return; }

      // 개구리 범위 진입 금지 규칙
      if (typeof isEnteringEnemyFrog === 'function' &&
          isEnteringEnemyFrog(unit.x, unit.y, x, y, unit.team)) {
        status && (status.textContent='개구리 범위로는 진입할 수 없습니다');
        return;
      }

      // 경로 차단: 첫 점유칸 뒤는 불가
      const stepX = dx > 0 ? 1 : -1;
      const stepY = dy > 0 ? 1 : -1;
      let cx = unit.x + stepX, cy = unit.y + stepY;
      let blocked = false;
      while (cx !== x || cy !== y) {
        if (cellOccupied(cx, cy)) { blocked = true; break; }
        cx += stepX; cy += stepY;
      }
      if (blocked) { status && (status.textContent='경로에 말이 있어 그 뒤로는 갈 수 없습니다'); return; }

      // 스냅샷 후 즉시 이동(에너지 소모 없음)
      pushSnapshot('skill:bishop-dash');
      unit.x = x; unit.y = y;
      unit._usedThisTurn = true;
      drawBoard();
      return;
    }
    // 현재 선택된 말 ID로 실제 객체를 조회 (undefined 접근 방지)
    const sel = players.find(p => p.id === selectedPlayerId) || null;

    if (!sel) {
      showPopup(e.pageX, e.pageY, onCellPlayers);
      return;
    }

    // 선택 있음 → 상하좌우면 이동, 아니면 팝업
    if (isOrthogonalNeighbor(sel.x, sel.y, x, y)) {
      const dx = x - sel.x;
      const dy = y - sel.y;
      if (!canApplyStep(sel, dx, dy)) return;
      pushSnapshot('click-move'); // 이동도 입력이므로 스냅샷
      applyStep(sel, dx, dy);
      return;
    }

      if (g._movedThisTurn) {
        g.power = 1; g.range = 1;
      } else {
        g.power = Math.min(4, (g.power ?? 1) + 1);
        g.range = Math.min(4, (g.range ?? 1) + 1);
      }
      g._movedThisTurn = false;
    }
  }
}

function getClownSuppressionTeams(unitsOnCell){
  const teamsHere = new Set(unitsOnCell.map(u => u.team));
  const suppressed = new Set();

  // ① 기본: 전투 칸에 광대가 있으면 상대 지원 0
  for (const u of unitsOnCell) {
    if (u.name === '광대' && !u._evolved) {
      for (const t of teamsHere) if (t !== u.team) suppressed.add(t);
    }
  }

  // ② 진화 광대: 그 팀이 전투에 ‘참여’하기만 하면 상대 지원 0
  //    (진화 광대 본인은 어디에 있어도 상관없음)
  const teamsWithEvolvedClown = new Set(
    players.filter(p => p.name === '광대' && p._evolved).map(p => p.team)
  );
  for (const t of teamsHere) {
    if (teamsWithEvolvedClown.has(t)) {
      for (const opp of teamsHere) if (opp !== t) suppressed.add(opp);
    }
  }
  return suppressed;
}

function nearestEmptyCell(fromX, fromY){

      for (let dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) + Math.abs(dy) > r) continue;
        const x = fromX + dx, y = fromY + dy;
        if (x < 0 || y < 0 || x >= size || y >= size) continue;
        if (!cellOccupied(x,y) && snowballAt(x,y) === -1) {
          return { x, y };
        }
      }
    }
  }
  return null;
}

    if (u._banishedUntilRound && u._banishedUntilRound>=until) continue;
    u._banishedUntilRound = until;
    u._banishedReturn = { x: u.x, y: u.y };
    u.x = -1; u.y = -1; // 보드에서 제거
  }
}
function processBanishedReturns(turnTeam){

    if (currentRound < u._banishedUntilRound) continue;
    const backTo = u._banishedReturn || getTeamStartPos(u.team);
let dest = backTo;

// 1) 원래 칸
if (!cellOccupied(backTo.x, backTo.y) && snowballAt(backTo.x, backTo.y) === -1) {
  dest = backTo;
} else {
  // 2) 같은 팀 출발지점 시도
  const kp = getTeamStartPos(u.team);
  if (kp && !cellOccupied(kp.x, kp.y) && snowballAt(kp.x, kp.y) === -1) {
    dest = kp;
  } else {
    // 3) 근거리(반경1~3)만 검색
    const near = nearestEmptyCell(backTo.x, backTo.y);
    dest = near || backTo;
  }
}

u.x = dest.x; u.y = dest.y;
    delete u._banishedUntilRound;
    delete u._banishedReturn;
  }
}

function rotatedOrder(start) { return [0,1,2,3].map((_,i)=> (start + i) % 4); }
function makeRandomPool() {
  const remain = ALL_SPECIAL_NAMES.filter(n => n !== '산타클로스' && !randomDraft.taken.has(n));
  // 남은 개수가 4 미만인 경우: 가능한 만큼만 제시(이 경우 자동으로 드래프트가 조기 종료될 수 있음)
  const need = Math.min(4, remain.length);
  for (let i = remain.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [remain[i], remain[j]] = [remain[j], remain[i]];
  }
  return remain.slice(0, need);
}

    mpStatus.textContent = '오프라인';

(function setupUiToggle(){
  const btn = document.getElementById('toggleUiBtn');
  const key = 'board_ui_hidden';
  const apply = (hide) => {
    document.body.classList.toggle('ui-hidden', hide);
    btn.textContent = hide ? 'UI 보이기' : 'UI 숨기기';
  };
  apply(localStorage.getItem(key) === '1');
  btn.addEventListener('click', () => {
    const hide = !document.body.classList.contains('ui-hidden');
    localStorage.setItem(key, hide ? '1' : '0');
    apply(hide);
  });
})();

// ✅ 공용: 상인 스킬 실행
function beginMerchantTrade(merchant) {
  if (!merchant) { status && (status.textContent = '상인: 대상 없음'); return; }
  if (merchant._usedThisTurn) { status && (status.textContent = '상인: 이번 턴에 이미 사용'); return; }

  const team = merchant.team;

  // 희생 후보: 같은 팀, 본인/왕/성 제외, 판 위에 존재
  const candidates = players.filter(u =>
    u.team === team &&
    u.id !== merchant.id &&
    u.name !== '왕' &&
    !(typeof isCastle === 'function' && isCastle(u)) &&
    Number.isInteger(u.x) && Number.isInteger(u.y) && u.x >= 0 && u.y >= 0
  );

  if (candidates.length === 0) {
    status && (status.textContent = '상인: 희생할 아군이 없습니다');
    return;
  }

  // 스냅샷 먼저
  pushSnapshot('skill:merchant');

  // 무작위 희생
  const victim = candidates[Math.floor(Math.random() * candidates.length)];
  const vx = victim.x, vy = victim.y;
  const victimName = victim.name;

  // 특수(45%) / 일반(55%)
  let newUnit = null;
  if (Math.random() < 0.45) {
    // ✅ ‘블레이즈 & 엠버’ 제외 / ‘블레이즈’, ‘엠버’ 각각 포함
    const specialPool = [
      '저격수','기자','고목','사신','사육사','건축가','닌자','범고래','수레꾼',
      '의사','좀비','도박사','눈사람','폼트랜서','광대','스키퍼','여왕개미','상인',
      '응원단장','트럭 운전사','블레이즈','엠버','개미','비숍','산타클로스','샤워기'
    ];
    const pick = specialPool[Math.floor(Math.random() * specialPool.length)];
    newUnit = createSpecialUnitByName(pick, team);
  } else {
    // 일반 병사 생성기 (프로젝트 컨벤션에 맞게 조정)
    newUnit = {
      id: `p${team+1}-m-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
      name: '일반 병사',
      team, x: vx, y: vy,
      color: getTeamColor ? getTeamColor(team) : undefined,
      power: 1, movement: 1, range: 0
    };
  }

  // 희생 → 소환
  removePlayer(victim, true);
  if (newUnit) { newUnit.x = vx; newUnit.y = vy; players.push(newUnit); }

  merchant._usedThisTurn = true;

  const tradeMsg = `상인: ${victimName} 제거 → ${newUnit ? newUnit.name : '실패'}`;
  showCenterMessage?.(tradeMsg, 2000);
  flashCell?.(vx, vy, 1000);
  drawBoard?.();
  // executeSkill()이 이후에 status를 일반 문구로 덮어쓰므로, 그 다음 틱에 거래 결과로 다시 덮어쓴다
  setTimeout(() => { status && (status.textContent = tradeMsg); }, 0);
  setTimeout(() => { drawBoard(); }, 2000);

  if (online) {
    const state = toRoomState();
    broadcast({ t: 'SYNC', state, hash: hashState() });
  }
}
function getAvailableSkills(units) {
  const skills = [];
  const canBuildCastle = (u) =>
    (countCastles(u.team) < 5) &&
    !hasCastleAt(u.team, u.x, u.y) &&
    !cellOccupied(u.x, u.y);

  units.forEach((unit) => {
    const name = unit.name;
    // ⑫ 비숍: 대각선 질주
if (name === '비숍' && unit.team === currentTurn) {
  skills.push({
    icon: '♗',
    unitName: '비숍',
    skillName: '대각선 질주',
    description: '이번 차례에 한 번, 대각선으로 몇 칸이든 이동(경로 첫 점유칸 뒤는 불가).',
    condition: '차례당 1회',
    available: !unit._usedThisTurn,
    execute: () => {
      bishopDash.active = true;
      bishopDash.unitId = unit.id;
      if (popup) popup.style.display = 'none';
      status && (status.textContent = '대각선 목적지 칸을 클릭하세요');
    }
  });
}
    // ⑬ 샤워기: 웅덩이 만들기
    if (name === '샤워기' && unit.team === currentTurn) {
      const blockedByMate = players.some(p =>
        p.id !== unit.id && p.x === unit.x && p.y === unit.y && !canStandOnWaterPuddle(p)
      );
      const can = (currentRound % 3 === 0) && !unit._usedThisTurn && !blockedByMate;
      skills.push({
        icon: '🚿',
        unitName: '샤워기',
        skillName: '웅덩이 만들기',
        description: "현재 칸을 '물 웅덩이'로 만듭니다. 샤워기·개구리·고목·범고래 외의 말은 물 웅덩이 위에 있을 수 없습니다.",
        condition: '3턴마다 사용 가능',
        available: can,
        execute: () => {
          if (!isWaterPuddle(unit.x, unit.y)) waterPuddles.push({ x: unit.x, y: unit.y });
          unit._usedThisTurn = true;
          updateShowerPressureBuff();
          drawBoard();
        }
      });
    }
    // ① 기자: 특종 (5턴마다, 자기 위치로 아군 집결)
    if (name === '기자') {
      const can = (currentRound % 5 === 0) && (unit._lastGatherRound !== currentRound);
      skills.push({
        icon: '📰',
        unitName: '기자',
        skillName: '특종',
        description: '모든 아군을 기자의 위치로 소환합니다.',
        condition: '5턴마다 사용 가능',
        available: can,
        execute: () => {
          const tx = unit.x, ty = unit.y;
          for (const u of players) {
            if (u.team === unit.team && u.id !== unit.id) {
              u.x = tx; u.y = ty;
            }
          }
          unit._lastGatherRound = currentRound;
          drawBoard();
        }
      });
    }

    // ② 사육사/코끼리/고양이/개구리: 대신 싸우기 (2턴마다 변신 메뉴)
    if (name === '사육사' || name === '코끼리' || name === '고양이' || name === '개구리') {
      const can = (currentRound % 2 === 0);
      skills.push({
        icon: '🦁',
        unitName: name,
        skillName: '대신 싸우기',
        description: '동물 형태로 변신합니다.',
        condition: '2턴마다 사용 가능',
        available: can,
        execute: () => { beginKeeperChoice(unit); }
      });
    }

    // ③ 건축가: 성 쌓기
    if (name === '건축가') {
      const can = (currentRound % 2 === 0) && unit._castleBuiltRound !== currentRound;
      skills.push({
        icon: '🏗️',
        unitName: '건축가',
        skillName: '성 쌓기',
        description: '현재 위치에 성을 즉시 건설합니다.',
        condition: '짝수 턴마다 1회 사용 가능',
        available: can,
        execute: () => { addCastle(unit.team, unit.x, unit.y); unit._castleBuiltRound = currentRound; drawBoard(); }
      });
    }

    // ④ 닌자: 침투
    if (name === '닌자' || name === '숙련된 닌자') {
      const can = (currentRound % 3 === 0) && isAlone(unit) && !ninjaSwappedThisTurn;
      skills.push({
        icon: '🥷',
        unitName: name,
        skillName: '침투',
        description: '사거리 내 적과 위치를 바꿉니다.',
        condition: '3턴마다, 혼자 있을 때 사용 가능',
        available: can,
        execute: () => { beginNinjaSwap(unit); }
      });
    }

    // ⑤ 수레꾼: 손님 받아라
    if (name === '수레꾼') {
      skills.push({
        icon: '🛒',
        unitName: '수레꾼',
        skillName: '손님 받아라',
        description: '같은 칸의 아군과 연결하여 함께 이동합니다.',
        condition: '항상 사용 가능',
        available: true,
        execute: () => { beginCartLink(unit); }
      });
    }

    // ⑥ 폼트랜서: 변신
    if (name === '폼트랜서' || name === '폼트렌서') {
      const can = (currentRound % 3 === 0);
      skills.push({
        icon: '🎭',
        unitName: '폼트랜서',
        skillName: '변신',
        description: '특수 병사로 변신합니다(차례 종료 시 원복).',
        condition: '3턴마다 사용 가능',
        available: can,
        execute: () => { beginFormPick(unit); }
      });
    }

    // ⑦ 스키퍼: 턴 스킵
    if (name === '스키퍼') {
      const can = diceRolledThisTurn && !unit._usedThisTurn && lastDiceRoll >= 6;
      skills.push({
        icon: '⏭️',
        unitName: '스키퍼',
        skillName: '턴 스킵',
        description: '턴 수를 1~5 증가시킵니다.',
        condition: '주사위 6 이상일 때, 차례당 1회',
        available: can,
        execute: () => { beginTricksterMenu(unit); }
      });
    }

    // ⑧ 여왕개미: 개미 다루기
    if (name === '여왕개미') {
      const can = (currentRound % 4 === 0) && !unit._usedThisTurn;
      skills.push({
        icon: '👑',
        unitName: '여왕개미',
        skillName: '개미 다루기',
        description: '개미 3마리 소환 또는 모든 아군 개미 전투력 +0.25.',
        condition: '4턴마다 사용 가능',
        available: can,
        execute: () => { beginQueenMenu(unit); }
      });
    }

    // ⑨ 상인: 거래 (오류 수정됨)
    if (name === '상인') {
        skills.push({
          icon: '💰',
          unitName: '상인',
          skillName: '거래',
          description: '아군 하나를 희생하여 새로운 유닛을 소환합니다.',
          condition: '차례당 1회',
          available: !unit._usedThisTurn,
          execute: () => beginMerchantTrade(unit)
        });
    }

    // ⑩ 트럭 운전사: 2D 세카이
    if (name === '트럭 운전사') {
      const can = (currentRound % 5 === 0) && ((unit._dirStreak || 0) >= 2) && !unit._truckUsedThisTurn;
      skills.push({
        icon: '🚚',
        unitName: '트럭 운전사',
        skillName: '2D 세카이로 보내기',
        description: '현재 위치 기준 반경 2칸 유닛을 즉시 잠시 제외합니다.',
        condition: '5턴마다, 직전 2회 연속 같은 방향으로 이동한 후 사용 가능',
        available: can,
        execute: () => {
          unit._truckUsedThisTurn = true;
          unit._dirStreak = 0; // 스킬 사용 후 방향 스트릭 초기화(재사용하려면 다시 2연속 이동 필요)

          // 트럭 운전사 현재 위치 기준 반경 2칸(맨해튼 거리) 이내의 유닛을 즉시 잠시 제외
          const nearby = players.filter(p =>
            p.id !== unit.id &&
            p.x >= 0 && p.y >= 0 &&
            (Math.abs(p.x - unit.x) + Math.abs(p.y - unit.y)) <= 2
          );
          banishUnits(nearby, 2, unit.id);

          if (popup) popup.style.display = 'none';
          drawBoard();
        }
      });
    }

    // ⑪ 엠버: 블레이즈와 연결
    if (name === '엠버') {
      const sameCellBlaze = players.find(p => p.team === unit.team && p.name === '블레이즈' && p.x === unit.x && p.y === unit.y && p.x >= 0);
      if (sameCellBlaze && unit._linkedBlazeId !== sameCellBlaze.id) {
        skills.push({
          icon: '🔗',
          unitName: '엠버',
          skillName: '블레이즈와 연결',
          description: '블레이즈와 연결합니다. 연결된 동안 엠버가 이동하는 칸에 블레이즈가 함께 따라옵니다. 서로 다른 칸에 있게 되면 연결이 풀립니다.',
          condition: '블레이즈와 같은 칸에 있을 때',
          available: true,
          execute: () => {
            unit._linkedBlazeId = sameCellBlaze.id;
            drawBoard();
          }
        });
      }
    }

    // 엠버: 블레이즈 육성
    if (name === '엠버') {
      const hasBlaze = players.some(p => p.team === unit.team && p.name === '블레이즈' && p.x >= 0 && p.y >= 0);
      if (!hasBlaze && !unit._grownUsed) {
        const canPromote = players.some(u => u.team === unit.team && u.name === '일반 병사' && u.x >= 0 && u.y >= 0);
        skills.push({
          icon: '🔥',
          unitName: '엠버',
          skillName: '블레이즈 육성',
          description: '아군 일반 병사를 블레이즈로 전직시키고 그 위치로 이동합니다.',
          condition: '팀에 블레이즈가 없을 때 1회',
          available: canPromote,
          execute: () => {
            const cands = players.filter(u => u.team === unit.team && u.name === '일반 병사' && u.x >= 0 && u.y >= 0);
            if (cands.length === 0) { if (status) status.textContent = '전직할 일반 병사가 없습니다'; return; }
            const target = cands[Math.floor(Math.random() * cands.length)];
            unit.x = target.x; unit.y = target.y;
            target.name = '블레이즈';
            target.type = 'blaze';
            target.power = 1; target.range = 0; target.movement = 1;
            if (!Array.isArray(target.tags)) target.tags = [];
            if (!target.tags.includes('특수 병사')) target.tags.push('특수 병사');
            unit._grownUsed = true;
            updateBlazeEmberAura();
            drawBoard();
          }
        });
      }
    }
  });

  // 조건을 만족하지 못하는 특수 병사들도 목록에 표시 (비활성 상태)
  units.forEach((unit) => {
    if (!isSpecialUnit || !isSpecialUnit(unit)) return;
    const hasAny = skills.some(s => s.unitName === unit.name);
    if (!hasAny) {
      skills.push({
        icon: '🔒',
        unitName: unit.name,
        skillName: '스킬/패시브',
        description: '현재 사용 가능한 액티브 스킬이 없거나 패시브 유닛입니다.',
        condition: '사용 불가',
        available: false
      });
    }
  });

  return skills;
}
function updateBlazeEmberAura() {
  const teams = new Set(players.filter(u => u.name === '블레이즈' || u.name === '엠버').map(u => u.team));
  for (const t of teams) {
    const blazes = players.filter(u => u.team === t && u.name === '블레이즈' && u.x >= 0 && u.y >= 0);
    const embers = players.filter(u => u.team === t && u.name === '엠버'   && u.x >= 0 && u.y >= 0);

    // 모든 블레이즈에 대해 같은 칸의 엠버 존재 여부로 버프·해제
    for (const b of blazes) {
      const sameCellEmber = embers.some(e => e.x === b.x && e.y === b.y);
      if (sameCellEmber) {
        b._emberBoosted = true;
        b.power = 4;
        b.movement = 0;
      } else if (b._emberBoosted) {
        b._emberBoosted = false;
        b.power = 1;
        b.movement = 1;
      }
    }

    // 엠버-블레이즈 연결: 서로 다른 칸에 있게 되면 연결 해제
    for (const e of embers) {
      if (!e._linkedBlazeId) continue;
      const linkedBlaze = players.find(u => u.id === e._linkedBlazeId);
      if (!linkedBlaze || linkedBlaze.x !== e.x || linkedBlaze.y !== e.y || linkedBlaze.x < 0) {
        e._linkedBlazeId = null;
      }
    }
  }
}
function executeSkill(skill) {
  pushSnapshot(`skill:${skill?.skillName || 'unknown'}`);
  if (skill.execute) {
    skill.execute();
    // 비숍처럼 후속 클릭을 기다리는 스킬은 자체 안내 문구를 유지시킨다
    if (!bishopDash.active) {
      status && (status.textContent = `${skill.icon} ${skill.unitName} — ${skill.skillName} 사용!`);
    }
    drawBoard?.();
    if (online) {
      const state = toRoomState();
      broadcast({ t: 'SYNC', state, hash: hashState() });
    }
  }
}
function centerPopup(popupEl) {
  popupEl.style.left = '50%';
  popupEl.style.top = '50%';
  popupEl.style.transform = 'translate(-50%, -50%)';
}
(function enableBoardPanningAndCentering(){
  const wrap = document.getElementById('boardWrapper');
  const grid = document.getElementById('board');
  if (!wrap || !grid) return;

  function centerBoard() {
    setTimeout(() => {
      wrap.scrollLeft = Math.max(0, (grid.scrollWidth  - wrap.clientWidth)  / 2);
      wrap.scrollTop  = Math.max(0, (grid.scrollHeight - wrap.clientHeight) / 2);
    }, 0);
  }
  window.addEventListener('load', centerBoard);
  window.addEventListener('resize', centerBoard);

  let dragging = false, sx = 0, sy = 0, sl = 0, st = 0, pid = null, armed = false;
wrap.addEventListener('pointerdown', (e) => {
if (e.target.closest('#popup') || e.target.closest('button')) return;
pid = e.pointerId;
wrap.setPointerCapture(pid);
sx = e.clientX; sy = e.clientY; sl = wrap.scrollLeft; st = wrap.scrollTop;
armed = true; dragging = false;
});
wrap.addEventListener('pointermove', (e) => {
if (!armed) return;
const dx0 = e.clientX - sx, dy0 = e.clientY - sy;
if (!dragging) {
if (Math.abs(dx0) + Math.abs(dy0) > 3) dragging = true; // 임계값
else return;
}
wrap.scrollLeft = sl - dx0;
wrap.scrollTop = st - dy0;
});
const end = (ev) => {
  const wasArmed = armed;
  const wasDragging = dragging;

  armed = false;
  if (!pid) return;
  try { wrap.releasePointerCapture(pid); } catch(e){}
  pid = null;
  dragging = false;

  // 드래그가 아닌 '탭/클릭'이면, click 이벤트를 합성해 보드 셀의 클릭 핸들러가 확실히 실행되도록 보장
  if (wasArmed && !wasDragging && ev && typeof ev.clientX === 'number' && typeof ev.clientY === 'number') {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    if (el) {
      el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
    }
  }
};
wrap.addEventListener('pointerup', (e) => end(e));
wrap.addEventListener('pointercancel', (e) => end(e));
wrap.addEventListener('pointerleave', (e) => end(e));
})();
  </script>
</body>
